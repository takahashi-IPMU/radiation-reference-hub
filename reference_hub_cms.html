} function buildGroupOverview(){ const g = activeGroup(); if(!g) return ''; const secCards = g.sections.map(s=>` <div class="section-card" style="position:relative"> <div class="section-card-dot" style="background:${g.color}"></div> <div class="section-card-name sec-nav-card" data-group="${g.id}" data-sec="${s.id}" style="cursor:pointer">${esc(s.label)}</div> <div class="section-card-count">${s.refs.length} 文献</div> <div style="display:flex;gap:4px;margin-top:8px"> <button class="btn sm sec-nav-card" data-group="${g.id}" data-sec="${s.id}" style="flex:1;justify-content:center">→ 開く</button> <button class="btn sm btn-edit-sec-card" data-group="${g.id}" data-sec="${s.id}">✎</button> </div> </div>`).join(''); return ` <div class="group-overview"> <div class="group-overview-header"> <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"> <div style="width:14px;height:14px;border-radius:3px;background:${g.color};flex-shrink:0"></div> <h2>${esc(g.label)}</h2> <button class="btn sm" id="btn-edit-group">✎ 編集</button> <button class="btn sm danger" id="btn-del-group">✕</button> </div> <div class="group-overview-desc">${esc(g.desc||'')} &nbsp;·&nbsp; ${g.sections.length} セクション / ${groupRefCount(g)} 文献</div> </div> <div class="section-cards">${secCards}</div> </div>`;
} function buildSectionView(){ const g = activeGroup(); const sec = activeSection(); if(!sec||!g) return ''; const q = ui.search.trim().toLowerCase(); const refs = q ? sec.refs.filter(r=>(r.title+r.tag+r.meta+r.desc).toLowerCase().includes(q)) : sec.refs; const cards = refs.length===0 ? `<div class="empty">${q?'検索結果なし':'まだ文献がありません。「文献追加」ボタンから登録してください。'}</div>` : `<div class="ref-grid">${refs.map(r=>buildRefCard(r)).join('')}</div>`; return ` <div class="breadcrumb"> <span class="breadcrumb-group sb-group-btn" style="color:${g.color};cursor:pointer" data-group="${g.id}">${esc(g.label)}</span> <span class="breadcrumb-sep">›</span> <span>${esc(sec.label)}</span> </div> <div class="content-header"> <h2>${esc(sec.label)}</h2> <button class="btn sm" id="btn-edit-sec">✎ 編集</button> <button class="btn sm danger" id="btn-del-sec">✕ 削除</button> <button class="btn primary" id="btn-add-ref">+ 文献追加</button> </div> ${sec.note?`<div class="sec-note">${esc(sec.note)}</div>`:''} <div class="search-bar"> <input id="search-input" placeholder="このセクション内を検索…" value="${eattr(ui.search)}"> ${ui.search?`<button class="btn sm" id="btn-clear-search">✕ クリア</button>`:''} </div> ${cards}`;
} function buildRefCard(r){ return ` <div class="ref-card"> <div class="ref-tag">${esc(r.tag)}</div> <div class="ref-title">${esc(r.title)}</div> <div class="ref-meta">${esc(r.meta)}</div> <div class="ref-desc">${esc(r.desc)}</div> ${r.url?`<div class="ref-url">🔗 <a href="${eattr(r.url)}" target="_blank" rel="noopener">${esc(r.url.replace(/^https?:\/\//,'').substring(0,52))}${r.url.length>55?'…':''}</a></div>`:''} <div class="ref-actions"> ${r.url?`<a href="${eattr(r.url)}" target="_blank" rel="noopener" class="btn sm">↗ 開く</a>`:''} <button class="btn sm btn-edit-ref" data-id="${r.id}">✎ 編集</button> <button class="btn sm danger btn-del-ref" data-id="${r.id}">✕</button> </div> </div>`;
} /* ── Import ── */
function buildImport(){ const msg = ui.importMsg.text?`<div class="notice ${ui.importMsg.type}">${esc(ui.importMsg.text)}</div>`:''; const gOpts = state.groups.map(g=>`<optgroup label="${eattr(g.label)}">${g.sections.map(s=>`<option value="${g.id}|${s.id}">${eattr(s.label)}</option>`).join('')}</optgroup>`).join(''); return ` <div class="import-card"> <h3>一括インポート（JSON 形式）</h3> <div class="notice">tag / title / meta / desc / url フィールドを持つ JSON 配列を貼り付けてください。title は必須です。</div> ${msg} <div class="field"><label>JSON 貼り付け</label> <textarea id="bulk-json" style="min-height:150px;font-family:var(--mono);font-size:11px" placeholder='[{"tag":"IEEE – SEE","title":"論文タイトル","meta":"著者 · 誌名 · 年","desc":"説明","url":"https://..."}]'></textarea> </div> <div class="field"><label>追加先セクション</label><select id="bulk-sec">${gOpts}</select></div> <button class="btn primary" id="btn-bulk-import">↑ インポート実行</button> </div> <div class="import-card"> <h3>単件追加</h3> <p style="font-size:12px;color:var(--text2);margin-bottom:10px">「文献一覧」タブでセクションを選択し「文献追加」ボタンから追加できます。</p> <button class="btn" id="btn-goto-browse">→ 文献一覧に移動</button> </div>`;
} /* ── Export ── */
function buildExport(){ if(!ui.exportHtml) ui.exportHtml = generateHtml(); const lines = (ui.exportHtml.match(/\n/g)||[]).length+1; return ` <div class="stats"> <div class="stat"><div class="stat-num">${state.groups.length}</div><div class="stat-label">グループ（大項目）</div></div> <div class="stat"><div class="stat-num">${totalSections()}</div><div class="stat-label">セクション（中項目）</div></div> <div class="stat"><div class="stat-num">${totalRefs()}</div><div class="stat-label">文献総数</div></div> <div class="stat"><div class="stat-num">${lines}</div><div class="stat-label">出力行数</div></div> </div> <div class="code-wrap"> <div class="code-header"> <span>reference_hub.html — Gemini スタイルで生成</span> <button class="btn sm" id="btn-regen">↺ 再生成</button> <button class="btn sm primary" id="btn-copy">⎘ コピー</button> <button class="btn sm" id="btn-dl">↓ ダウンロード</button> </div> <div class="code-body">${esc(ui.exportHtml)}</div> </div>`;
} /* ── Modal ── */
function buildModal(){ const f=ui.form; let inner=''; const colorSwatches = COLORS.map(c=>`<div class="color-swatch ${f.color===c?'selected':''}" style="background:${c}" data-color="${c}"></div>`).join(''); if(ui.modal==='add-ref'||ui.modal==='edit-ref'){ inner=` <div class="modal-title">${ui.modal==='add-ref'?'文献を追加':'文献を編集'}</div> <div class="field"><label>タグ（種別・機関）</label><input id="f-tag" value="${eattr(f.tag||'')}" placeholder="例: IEEE – SEE Test"></div> <div class="field"><label>タイトル *</label><input id="f-title" value="${eattr(f.title||'')}" placeholder="論文・文書のタイトル"></div> <div class="field"><label>著者 · 誌名 · 年</label><input id="f-meta" value="${eattr(f.meta||'')}" placeholder="例: Schwank et al. · IEEE TNS 60 · 2013"></div> <div class="field"><label>説明（日本語）</label><textarea id="f-desc">${esc(f.desc||'')}</textarea></div> <div class="field"><label>URL（省略可）</label><input id="f-url" value="${eattr(f.url||'')}" placeholder="https://doi.org/..."></div> <div class="modal-actions"><button class="btn" id="m-cancel">キャンセル</button><button class="btn primary" id="m-save">保存</button></div>`; } else if(ui.modal==='add-sec'||ui.modal==='edit-sec'){ inner=` <div class="modal-title">${ui.modal==='add-sec'?'セクションを追加':'セクションを編集'}</div> <div class="field"><label>セクション名 *</label><input id="f-label" value="${eattr(f.label||'')}" placeholder="例: RHA / SEE Testing – Standards"></div> <div class="field"><label>サブタイトル（省略可）</label><input id="f-note" value="${eattr(f.note||'')}" placeholder="例: 試験規格・試験施設に関する文書"></div> <div class="modal-actions"><button class="btn" id="m-cancel">キャンセル</button><button class="btn primary" id="m-save">保存</button></div>`; } else if(ui.modal==='add-group'||ui.modal==='edit-group'){ inner=` <div class="modal-title">${ui.modal==='add-group'?'グループを追加':'グループを編集'}</div> <div class="field"><label>グループ名 *</label><input id="f-label" value="${eattr(f.label||'')}" placeholder="例: Space Mission Reference Hub"></div> <div class="field"><label>説明（省略可）</label><input id="f-desc" value="${eattr(f.desc||'')}" placeholder="例: index.html より"></div> <div class="field"><label>カラー</label><div class="color-picker" id="color-picker">${colorSwatches}</div></div> <div class="modal-actions"><button class="btn" id="m-cancel">キャンセル</button><button class="btn primary" id="m-save">保存</button></div>`; } else if(ui.modal==='meta'){ inner=` <div class="modal-title">サイト設定</div> <div class="field"><label>タイトル</label><input id="f-title" value="${eattr(f.title||'')}"></div> <div class="field"><label>サブタイトル</label><input id="f-subtitle" value="${eattr(f.subtitle||'')}"></div> <div class="modal-actions"><button class="btn" id="m-cancel">キャンセル</button><button class="btn primary" id="m-save">保存</button></div>`; } return `<div class="overlay" id="overlay"><div class="modal">${inner}</div></div>`;
} /* ============================================================ EVENTS ============================================================ */
function bindEvents(){ const $=id=>document.getElementById(id); const on=(id,ev,fn)=>{const el=$(id);if(el)el.addEventListener(ev,fn);}; /* Tabs */ document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ ui.tab=b.dataset.tab; ui.search=''; if(ui.tab==='export') ui.exportHtml=generateHtml(); render(); })); /* Topbar */ on('btn-meta','click',()=>{ui.modal='meta';ui.form={title:state.meta.title,subtitle:state.meta.subtitle};render();}); on('btn-export-quick','click',()=>{ui.tab='export';ui.exportHtml=generateHtml();render();}); /* Sidebar: group header click (go to group overview) */ document.querySelectorAll('.sb-group-btn').forEach(el=>el.addEventListener('click',()=>{ ui.view={type:'group',groupId:el.dataset.group};ui.search='';ui.tab='browse';render(); })); /* Sidebar: collapse/expand toggle */ document.querySelectorAll('.sb-group-toggle').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); const g=findGroup(el.dataset.group);if(g) g.collapsed=!g.collapsed;render(); })); /* Sidebar: section click */ document.querySelectorAll('.sb-item[data-sec]').forEach(el=>el.addEventListener('click',()=>{ ui.view={type:'section',groupId:el.dataset.group,sectionId:el.dataset.sec};ui.search='';ui.tab='browse';render(); })); /* Group overview: section card click */ document.querySelectorAll('.sec-nav-card').forEach(el=>el.addEventListener('click',()=>{ ui.view={type:'section',groupId:el.dataset.group,sectionId:el.dataset.sec};ui.tab='browse';render(); })); /* Add buttons */ on('btn-add-group','click',()=>{ui.modal='add-group';ui.form={color:COLORS[0]};render();}); on('btn-add-sec','click',()=>{ if(!ui.view){ alert('まずグループを選択してください'); return; } ui.modal='add-sec';ui.form={};render(); }); on('btn-add-ref','click',()=>{ui.modal='add-ref';ui.form={};render();}); on('btn-edit-group','click',()=>{ const g=activeGroup();if(!g)return; ui.modal='edit-group';ui.editId=g.id;ui.form={label:g.label,desc:g.desc||'',color:g.color};render(); }); on('btn-del-group','click',()=>{ if(!confirm('このグループを削除しますか？（配下のセクション・文献も全て削除されます）'))return; state.groups=state.groups.filter(g=>g.id!==ui.view.groupId); ui.view=state.groups[0]?{type:'group',groupId:state.groups[0].id}:null;render(); }); on('btn-edit-sec','click',()=>{ const g=activeGroup();const sec=activeSection();if(!sec||!g)return; ui.modal='edit-sec';ui.editId=g.id+'|'+sec.id;ui.form={label:sec.label,note:sec.note||''};render(); }); document.querySelectorAll('.btn-edit-sec-card').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); const gid=b.dataset.group,sid=b.dataset.sec; const sec=findSection(gid,sid);if(!sec)return; ui.modal='edit-sec';ui.editId=gid+'|'+sid;ui.form={label:sec.label,note:sec.note||''};render(); })); on('btn-del-sec','click',()=>{ if(!confirm('このセクションを削除しますか？（文献も全て削除されます）'))return; const g=activeGroup();if(g){g.sections=g.sections.filter(s=>s.id!==ui.view.sectionId);} ui.view={type:'group',groupId:ui.view.groupId};render(); }); document.querySelectorAll('.btn-edit-ref').forEach(b=>b.addEventListener('click',()=>{ const sec=activeSection();const ref=sec?.refs.find(r=>r.id===b.dataset.id); if(ref){ui.modal='edit-ref';ui.editId=b.dataset.id;ui.form={...ref};render();} })); document.querySelectorAll('.btn-del-ref').forEach(b=>b.addEventListener('click',()=>{ if(!confirm('この文献を削除しますか？'))return; const sec=activeSection();if(sec)sec.refs=sec.refs.filter(r=>r.id!==b.dataset.id);render(); })); /* Search */ on('search-input','input',e=>{ui.search=e.target.value;render();}); on('btn-clear-search','click',()=>{ui.search='';render();}); /* Import */ on('btn-bulk-import','click',()=>{ const jEl=$('bulk-json'),val=$('bulk-sec')?.value; if(!jEl||!val)return; const [gid,sid]=val.split('|'); try{ const arr=JSON.parse(jEl.value); if(!Array.isArray(arr))throw new Error('配列（[ ]）形式で入力してください'); const sec=findSection(gid,sid); arr.forEach(r=>sec.refs.push({id:eid(),tag:r.tag||'',title:r.title||'',meta:r.meta||'',desc:r.desc||'',url:r.url||''})); ui.importMsg={type:'success',text:`✓ ${arr.length} 件をインポートしました`}; jEl.value=''; }catch(e){ui.importMsg={type:'error',text:'エラー: '+e.message};} render(); }); on('btn-goto-browse','click',()=>{ui.tab='browse';render();}); /* Export */ on('btn-regen','click',()=>{ui.exportHtml=generateHtml();render();}); on('btn-copy','click',()=>{ navigator.clipboard.writeText(ui.exportHtml).then(()=>{ const b=$('btn-copy');if(b){b.textContent='✓ コピー済み';setTimeout(()=>{const b2=$('btn-copy');if(b2)b2.textContent='⎘ コピー';},2000);} }).catch(()=>{const ta=document.createElement('textarea');ta.value=ui.exportHtml;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}); }); on('btn-dl','click',()=>{ const a=document.createElement('a'); a.href='data:text/html;charset=utf-8,'+encodeURIComponent(ui.exportHtml); a.download='reference_hub.html';a.click(); }); /* Modal */ on('overlay','click',e=>{if(e.target.id==='overlay'){ui.modal=null;render();}}); on('m-cancel','click',()=>{ui.modal=null;render();}); /* Color swatches */ document.querySelectorAll('#color-picker .color-swatch').forEach(el=>el.addEventListener('click',()=>{ ui.form.color=el.dataset.color; document.querySelectorAll('#color-picker .color-swatch').forEach(e=>e.classList.remove('selected')); el.classList.add('selected'); })); on('m-save','click',()=>{ const $=id=>document.getElementById(id); if(ui.modal==='add-ref'||ui.modal==='edit-ref'){ const sec=activeSection();if(!sec)return; const title=$('f-title')?.value.trim();if(!title){alert('タイトルは必須です');return;} const ref={id:ui.modal==='edit-ref'?ui.editId:eid(),tag:$('f-tag')?.value.trim()||'',title,meta:$('f-meta')?.value.trim()||'',desc:$('f-desc')?.value.trim()||'',url:$('f-url')?.value.trim()||''}; if(ui.modal==='add-ref'){sec.refs.push(ref);} else{const i=sec.refs.findIndex(r=>r.id===ui.editId);sec.refs[i]=ref;} } else if(ui.modal==='add-sec'||ui.modal==='edit-sec'){ const label=$('f-label')?.value.trim();if(!label){alert('セクション名は必須です');return;} const note=$('f-note')?.value.trim()||''; if(ui.modal==='add-sec'){ const g=activeGroup();if(!g)return; const id=eid();g.sections.push({id,label,note,refs:[]}); ui.view={type:'section',groupId:g.id,sectionId:id}; } else { const [gid,sid]=ui.editId.split('|'); const sec=findSection(gid,sid);if(!sec)return; sec.label=label;sec.note=note; } } else if(ui.modal==='add-group'||ui.modal==='edit-group'){ const label=$('f-label')?.value.trim();if(!label){alert('グループ名は必須です');return;} const desc=$('f-desc')?.value.trim()||''; const color=ui.form.color||COLORS[0]; if(ui.modal==='add-group'){ const id=eid();state.groups.push({id,label,desc,color,collapsed:false,sections:[]}); ui.view={type:'group',groupId:id}; } else {const g=findGroup(ui.editId);g.label=label;g.desc=desc;g.color=color;} } else if(ui.modal==='meta'){ state.meta.title=$('f-title')?.value.trim()||state.meta.title; state.meta.subtitle=$('f-subtitle')?.value.trim()||state.meta.subtitle; } ui.modal=null;render(); });
} /* ============================================================ HTML GENERATOR — 2-level: group heading + section sub-heading ============================================================ */
function generateHtml(){ const ARROW=`<svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M5 15.5a.75.75 0 0 1 0-1.06L13.44 6H9a.75.75 0 0 1 0-1.5h6.25A.75.75 0 0 1 16 5.25V11.5a.75.75 0 0 1-1.5 0V7.06L6.56 15.5a.75.75 0 0 1-1.06 0Z"/></svg>`; /* Nav: group-level only */ const navLinks = state.groups.map(g=> `<a href="#${g.id}" class="nav-link" style="--nl-color:${g.color}">${esc(g.label)}</a>` ).join('\n '); const groupsHtml = state.groups.map(g => { const sectionsHtml = g.sections.map(sec => { const cards = sec.refs.map(r=>` <article class="card"> <div class="card-tag"><span class="tag-dot"></span>${esc(r.tag)}</div> <div class="card-title">${esc(r.title)}</div> <div class="card-meta">${esc(r.meta)}</div> <p class="card-desc">${esc(r.desc)}</p> ${r.url?`<a class="card-link" href="${eattr(r.url)}" target="_blank" rel="noopener"><span class="url-text">${esc(r.url)}</span>${ARROW}</a>`:''}`).join('\n </article>'); return ` <div class="subsection" id="${sec.id}"> <div class="subsection-header"> <div class="subsection-title">${esc(sec.label)}</div> ${sec.note?`<div class="subsection-note">${esc(sec.note)}</div>`:''} </div> <div class="cards"> ${cards} </article> </div> </div>`; }).join('\n'); return ` <section class="group-section" id="${g.id}"> <div class="group-header"> <div class="group-color-bar" style="background:${g.color}"></div> <div> <div class="group-title">${esc(g.label)}</div> ${g.desc?`<div class="group-desc">${esc(g.desc)}</div>`:''} </div> </div> ${sectionsHtml} </section>`; }).join('\n'); const now = new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}); return `<!DOCTYPE html>
<html lang="ja">

gn-self:stretch;flex-shrink:0;} .group-title{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;margin-bottom:.2rem;} .group-desc{font-size:.82rem;color:var(--muted-text);} /* Subsection */ .subsection{margin-bottom:2rem;} .subsection-header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin:0 0 .75rem .5rem;} .subsection-title{font-size:.93rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-text);} .subsection-note{font-size:.75rem;color:var(--muted-text);} /* Cards */ .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem;} .card{background:var(--bg-accent);border-radius:var(--card-radius);padding:1.6rem;border:1px solid rgba(148,163,184,.26);box-shadow:var(--card-shadow);backdrop-filter:blur(16px);position:relative;overflow:hidden;transition:transform 160ms ease-out,box-shadow 160ms,border-color 160ms;} .card::before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 0 0,var(--accent-soft),transparent 60%);opacity:0;transition:opacity 200ms;pointer-events:none;} .card:hover{transform:translateY(-3px);box-shadow:0 22px 48px rgba(15,23,42,.20);border-color:rgba(96,165,250,.8);} .card:hover::before{opacity:1;} .card-tag{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-color);margin-bottom:.55rem;display:flex;align-items:center;gap:.45rem;} .tag-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;} .card-title{font-size:.97rem;font-weight:600;margin-bottom:.35rem;line-height:1.4;} .card-meta{font-size:.8rem;color:var(--muted-text);margin-bottom:.7rem;} .card-desc{font-size:.88rem;color:var(--muted-text);line-height:1.65;margin:0 0 1rem;} .card-link{display:flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--accent-color);text-decoration:none;padding:.32rem .7rem;border-radius:999px;background:var(--accent-soft);border:1px solid rgba(148,163,184,.4);transit
