<script>
/* ============================================================ GROUP COLORS ============================================================ */
const COLORS = ['#2563eb','#7c3aed','#059669','#d97706','#dc2626','#0891b2','#9333ea','#65a30d','#ea580c','#0f766e']; /* ============================================================ DATA ── groups[] → sections[] → refs[] ============================================================ */
const INITIAL = { meta: { title:"Space Mission Reference Hub", subtitle:"月面放射線環境 · 放射線試験機関 · 耐放射線標準文書 · 耐放射線部品 · RadPC · 月面ミッション設計" }, groups: [ /* ═══════════════════════════════════════════════════ GROUP 0: 放射線の影響 ═══════════════════════════════════════════════════ */ { id:"g-radeffects", label:"放射線の影響", color:"#7c2d12", desc:"宇宙放射線が半導体デバイス・電子部品に与える物理的影響の基礎。TID・SEE・DDD のメカニズムと宇宙環境の全体像。新規参入者の入門資料から専門的レビュー論文まで。", collapsed: false, sections: [ { id:"rad-effects-basics", label:"放射線効果の基礎・教科書的文献", note:"TID / SEE / DDD のメカニズムを解説した入門スライド・レビュー論文（NASA NEPP・NTRS 無料配布）", refs:[ {id:"cern-see-destructive",tag:"SEE – 破壊的効果（写真付きスライド）",title:"Radiation Effects II: Single-Event Effects – Destructive events",meta:"M. Sacristan Barbero · CERN · CMS Detector Workshop · 2024年 · PDF 無料",desc:"SEB（シングルイベントバーンアウト）・SEGR（ゲート酸化膜破壊）・SEL（ラッチアップ）・スナップバックなど、破壊的 SEE を写真付きで解説した CERN の最新スライド（2024年）。半導体チップ上の損傷箇所の光学顕微鏡写真・断面図・デバイス物理を組み合わせて各効果を視覚的に説明しており、「SEE でチップに何が起こるか」を直感的に理解するための最良の入門資料の一つ。GaN デバイスでの単一粒子損傷事例も含む最新資料",url:"https://indico.cern.ch/event/1408522/contributions/5919769/attachments/2840940/5014901/Radiation%20Effects%20II%20Single-Event%20Effects%20-%20Destructive.pdf"}, {id:"sexton2003",tag:"SEE – 破壊的効果レビュー（Sexton 2003）",title:"Destructive Single-Event Effects in Semiconductor Devices and ICs",meta:"F. W. Sexton · Sandia National Laboratories · IEEE Trans. Nucl. Sci. 50(3) · 2003 · DOI: 10.1109/TNS.2003.1208568",desc:"破壊的 SEE（SEL・SEB・SEGR・スナップバック）を過去40年の研究史から体系的にレビューした決定版論文。SEB による電力 MOSFET のドレイン-ソース間バーンアウト・SEGR によるゲート酸化膜破壊の光学顕微鏡断面写真を含む。各効果の物理機構・初観測から現在の理解・ハードニング手法を詳述。Oldham（TID）・Dodd（SEU）と並ぶ NSREC 50周年記念特集号の三大レビュー論文の一篇",url:"https://sirad.pd.infn.it/~candelor/Parte6/TNS2003_SEB_SEGR_OKPerCorso.pdf"}, {id:"nepp-rad101",tag:"NASA NEPP – Radiation Effects 101（入門スライド）",title:"Radiation Effects on Electronics 101: Simple Concepts and New Challenges",meta:"K. A. LaBel · NASA GSFC / NEPP · NEPP WebEx Presentation · 2004年4月21日",desc:"宇宙用電子部品の観点から SEE と TID の全体像を教科書的にまとめた NASA NEPP の入門スライド集。SEE を「単一粒子による確率的イベント」・TID を「長時間で蓄積する劣化」として整理し、各効果の物理的メカニズム・デバイスへの影響・試験方法・軽減手法を平易に解説。新規参入者や宇宙機器設計者が放射線効果の概要を素早く把握するための最初の一冊として最適",url:"https://nepp.nasa.gov/docuploads/392333B0-7A48-4A04-A3A72B0B1DD73343/Rad_Effects_101_WebEx.pdf"}, {id:"space-env-effects",tag:"宇宙放射線環境と効果 – NASA 講義資料",title:"Space Environments and Effects",meta:"J. L. Barth · NASA GSFC · IEEE NPSS Distinguished Lecturer · 2018年9月 · NTRS: 20180007430",desc:"NASA GSFC の Janet Barth による宇宙放射線環境と半導体への影響の包括的講義スライド（PDF 117ページ）。GCR・SEP・捕捉放射線帯の特性から、TID・SEE・DDD・内部帯電・表面帯電の各効果と設計対策まで宇宙機器設計に必要な知識を俯瞰できる。新規参入者の入門資料として最適",url:"https://ntrs.nasa.gov/api/citations/20180007430/downloads/20180007430.pdf"}, {id:"barth2003-env",tag:"宇宙・大気・地上の放射線環境 – 総合レビュー",title:"Space, Atmospheric, and Terrestrial Radiation Environments",meta:"J. L. Barth, C. S. Dyer, E. G. Stassinopoulos · IEEE Trans. Nucl. Sci. 50(3) · 2003 · NTRS: 20030054354",desc:"GCR・SEP・捕捉放射線帯・大気中宇宙線・SAA・地上テラリアル中性子の各放射線環境を定量的に整理したレビュー。軌道別の線量・フルエンス・LET スペクトルの計算例も含まれており、半導体デバイスへの影響解析の前提となる環境理解の標準的入門資料。Oldham・Dodd と同号（NSREC 50周年記念特集号）",url:"https://ntrs.nasa.gov/api/citations/20030054354/downloads/20030054354.pdf"}, {id:"tid-basics",tag:"TID 基礎 – MOS デバイスの電離線量効果",title:"Total Ionizing Dose Effects in MOS Oxides and Devices",meta:"T. R. Oldham & F. B. McLean · IEEE Trans. Nucl. Sci. 50(3) · 2003 · DOI: 10.1109/TNS.2003.1208572",desc:"MOS デバイスにおける TID の物理メカニズムを体系的にレビューした決定版論文。SiO₂ 中での電子正孔対生成・正孔輸送・酸化膜トラップ電荷・界面準位形成の4段階プロセスを詳述。閾値電圧シフト・リーク電流増加・動作速度低下などのデバイス劣化現象と回路への影響も概説。NSREC 50周年記念特集号の一篇で、放射線効果入門から専門家まで広く参照される標準的レビュー",url:"https://ntrs.nasa.gov/api/citations/20030032300/downloads/20030032300.pdf"}, {id:"see-basics",tag:"SEE 基礎 – シングルイベント効果のメカニズム",title:"Basic Mechanisms and Modeling of Single-Event Upset in Digital Microelectronics",meta:"P. E. Dodd & L. W. Massengill · IEEE Trans. Nucl. Sci. 50(3) · 2003 · DOI: 10.1109/TNS.2003.813129",desc:"デジタル MOS デバイスにおける SEU の物理メカニズムと回路レベルモデリングのレビュー。重イオン・陽子による電荷生成・電荷収集・ビットフリップのメカニズム、DRAM / SRAM / 組み合わせ論理の各々での挙動、緩和技術（TMR・ECC）、技術スケーリングの影響を体系的に解説。同号の Oldham（TID）・Sexton（破壊的 SEE）と合わせて放射線効果の三大レビュー論文。IEEE 会員は IEEE Xplore より、非会員はリサーチゲート等から入手可能。",url:"https://ieeexplore.ieee.org/document/1208578/"}, {id:"lansce-handbook",tag:"LANSCE – 中性子放射線効果試験ハンドブック",title:"High-Energy Neutron Testing Handbook – Radiation Effect Testing at LANSCE/WNR",meta:"S. Wender et al. · Los Alamos National Laboratory · LAUR-19-30813 · 2019年",desc:"LANSCE の WNR（Weapons Neutron Research）白色中性子ビームを用いた半導体 SEE 試験の包括的ガイドブック。大気中宇宙線誘起中性子の物理的背景（SEE の定義・中性子スペクトル）から、WNR 施設の詳細・ビームタイム申請手続き・ICE House / ICE-II フライトパスの使い方・試験計画・データ解析方法まで体系的に解説。",url:"https://lansce.lanl.gov/facilities/wnr/_assets/Radiation-Effect-Testing-Handbook-LAUR-19-30813.pdf"} ] } ] }, /* ═══════════════════════════════════════════════════ GROUP 1: 宇宙空間放射線環境 ═══════════════════════════════════════════════════ */ { id:"g-lunar-rad", label:"宇宙空間放射線環境", color:"#2563eb", desc:"GCR・SEP の基礎・月面・LEO・深宇宙の放射線環境仕様・測定・モデリングに関する文献", collapsed: false, sections: [ { id:"gcr-sep-basics", label:"GCR・SEP 基礎文献", note:"銀河宇宙線（GCR）・太陽エネルギー粒子（SEP）の物理・モデル・特性", refs:[ {id:"gcr01",tag:"GCR – Flux Model (基礎)",title:"Galactic Cosmic Ray Flux Simulation and Prediction",meta:"W. R. Webber et al. · Advances in Space Research 17(2) · 1996 · DOI: 10.1016/0273-1177(95)00508-C",desc:"半導体デバイスへの影響評価に用いられる GCR モデルの古典的文献。Z=1〜28 のイオン種と電子について E=10〜10⁵ MeV/nucleon の範囲でフラックスをシミュレート・予測する動的 GCR モデルを提案。太陽活動（太陽黒点数）に連動した太陽変調・GCR の定常的な入射・重イオン成分を含む高エネルギースペクトルを定量化した基礎資料。SEE 解析で必要となる LET スペクトル計算の前提となるフラックスモデルの原典の一つ。",url:"https://www.sciencedirect.com/science/article/pii/027311779500508C"}, {id:"sep01",tag:"SEP – Modern Primer（教科書）",title:"Solar Energetic Particles: A Modern Primer on Understanding Sources, Acceleration and Propagation",meta:"D. Reames · Springer Nature · Lecture Notes in Physics 978 · 2021 · ISBN: 978-3-030-66402-2",desc:"太陽エネルギー粒子（SEP）の発生源・加速・伝播に関する現代的な入門教科書。SEP イベントの間欠的な発生・太陽距離依存性・大型フレア / CME 起源の大型 SEP イベント・粒子エネルギースペクトルのハード化と高エネルギー陽子・重イオン成分を体系的に解説。宇宙機電子機器の SEE リスク評価において GCR との根本的な違いを理解するための標準的な参考書。",url:"https://link.springer.com/book/10.1007/978-3-030-66402-2"} ] }, { id:"env-specs", label:"月面放射線環境", note:"DSNE / Lunar Surface Data Book / JAXA 宇宙環境標準 / Gateway 適用解説", refs:[ {id:"s01",tag:"NASA – Environment Spec",title:"SLS-SPEC-159 Cross-Program Design Specification for Natural Environments (DSNE), Rev H",meta:"NASA · Natural Environments · SEE（GCR / SPE / Trapped）",desc:"NASA の自然環境設計基準書。ISS クラス LEO と geomagnetic-unshielded 環境（NRHO 等）における SEE 環境（GCR, SPE, trapped protons）や帯電環境が体系的に定義されている。NRHO / LEO / 月面の放射線比較のベース文書。",url:"https://ntrs.nasa.gov/api/citations/20205007447/downloads/SLS-SPEC-159%20Cross-Program%20Design%20Specification%20for%20Natural%20Environments%20(DSNE)%20REVISION%20H.pdf"}, {id:"s02",tag:"NASA – Lunar Surface",title:"Lunar Surface Data Book, ACD-50044 Rev A (2023)",meta:"NASA · Lunar Environment · GCR / SPE / Thermal / Plasma",desc:"月面（特に極域）での照明・熱・プラズマ・ダスト・放射線環境をまとめたデータブック。放射線章では DSNE を参照しつつ月面表面の GCR / SPE 環境を整理。月面ローバーや着陸機の環境仕様を定義する際の基礎資料。",url:"https://ntrs.nasa.gov/api/citations/20230007818/downloads/ACD-50044%20Lunar%20Surface%20Data%20Book%20Rev%20A.pdf"}, {id:"s03",tag:"Gateway / NRHO",title:"Willis et al., \"Space Environments Applied to the Gateway Program\" (2024)",meta:"Gateway · NRHO · SEE & Charging · Application of DSNE",desc:"Gateway / NRHO ミッションに対して DSNE に基づく SEE・TID・帯電環境の適用方法を解説した技術論文。CMV 通過中の proton-induced SEE や GCR heavy-ion 環境の扱いが具体的に説明されている。",url:"https://www.researchgate.net/publication/384693538_Space_Environments_Applied_to_the_Gateway_Program"}, {id:"s04",tag:"JAXA – 宇宙環境標準",title:"JAXA-JERG-2-141「宇宙環境標準」",meta:"JAXA 技術標準 · JERG-2-141_N1.pdf",desc:"宇宙機が軌道上で遭遇する自然宇宙環境（真空、熱環境、放射線、プラズマ、帯電、メテオロイド／スペースデブリなど）を体系的に定義した JAXA の宇宙環境標準。日本の衛星・探査機開発における宇宙環境条件設定の基本文書。",url:"https://sma.jaxa.jp/TechDoc/Docs/JAXA-JERG-2-141_N1.pdf"} ] }, { id:"leo-env", label:"低軌道（LEO）放射線環境", note:"ISS / LEO 軌道での放射線環境測定・モデリング・SAA", refs:[ {id:"leo01",tag:"ISS – 放射線環境概説",title:"Space Radiation Environment on the International Space Station",meta:"T. Berger et al. · npj Microgravity 3, 2 · 2017 · DOI: 10.1038/s41526-017-0015-8",desc:"ISS における GCR・SAA（南大西洋異常域）・太陽粒子の 3 成分からなる LEO 放射線環境を包括的に概説。乗組員・電子機器それぞれへの寄与を定量化し、軌道高度・傾斜角・太陽活動依存性を議論。LEO ミッション放射線解析の標準的入門資料。",url:"https://www.nature.com/articles/s41526-017-0015-8"}, {id:"leo02",tag:"JAXA – 宇宙放射線環境 (JERG-2-141)",title:"JERG-2-141 宇宙環境計測データ集 – 軌道上放射線環境",meta:"JAXA 宇宙環境・エネルギー技術 · JERG-2-141",desc:"JAXA の宇宙環境データ集。LEO・GTO・GEO・月軌道等の電子・陽子・重イオンフラックスを軌道パラメータ別に整理したリファレンスデータ。日本の衛星・宇宙機の放射線設計に用いられる標準データソース。",url:"https://sma.jaxa.jp/TechDoc/Docs/JAXA-JERG-2-141.pdf"} ] }, { id:"lnd-models", label:"月面線量測定（LND）& モデリング", note:"Chang'e-4 LND measurements · Lunar dose modelling · REDMoon · GEANT4", refs:[ {id:"l01",tag:"Chang'e-4 LND – Measurement",title:"First Measurements of the Radiation Dose on the Lunar Surface",meta:"Zhang et al. · Science Advances · 2020",desc:"嫦娥4号着陸機の LND による、史上初の月面直接線量測定。月面平均線量率は約 0.55 mGy/day、線量当量 ~1.37 mSv/day を示し、月面 TID 見積もりやシールド検討の基準となる一次データ。",url:"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7215175/"}, {id:"l02",tag:"LND – Low-Energy GCR",title:"First Measurements of Low-Energy Cosmic Rays on the Lunar Surface",meta:"Luo et al. · Science Advances · 2022",desc:"LND により 10–100 MeV/n の低エネルギー GCR スペクトルを初めて月面で直接測定。表層近傍の線量や SEE（特に SEU）寄与の評価に不可欠な低エネルギー成分を提供。",url:"https://www.science.org/doi/10.1126/sciadv.abk1760"}, {id:"l03",tag:"LND – Primary & Albedo Protons",title:"Primary and Albedo Protons Detected by LND on Chang'e-4",meta:"Xu et al. · Frontiers in Astronomy and Space Sciences · 2022",desc:"9–368 MeV の一次 GCR プロトンと、65–77 MeV の月面アルベドプロトンを分離し定量。月面表面の二次粒子環境（特にアルベド）の理解に貢献。",url:"https://www.frontiersin.org/articles/10.3389/fspas.2022.974946/full"}, {id:"l04",tag:"LND – 5-Year Variation",title:"Study on the Variation Characteristics of Lunar Surface Radiation Dose Over the Past Five Years Based on LND",meta:"F. Tan et al. · Journal of Physics: Conference Series 3115, 012002 · 2025",desc:"2019–2024 の 5 年間、44 セットの LND 月面昼側データから線量レートと太陽活動（F10.7）との相関を解析。平均線量率 ~13.95 µGy/h とその時間変動を提示し、設計時の線量マージン設定に直接役立つロングターム統計を提供。",url:"https://iopscience.iop.org/article/10.1088/1742-6596/3115/1/012002"}, {id:"l05",tag:"Model – REDMoon",title:"Radiation Environment at the Surface and Subsurface of the Moon",meta:"Dobynde & Guo · JGR Planets · 2021",desc:"REDMoon モデルにより、月面表面〜地下の放射線環境を詳細に計算。LND 実測および Lunar Prospector データと比較しモデルを検証。月面地下線量や基地・遮蔽構造設計の基礎モデル。",url:"https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2021JE006930"}, {id:"l06",tag:"Model – Neutron/Gamma (Moon)",title:"Global Dose Distributions of Neutrons and Gamma-Rays on the Moon",meta:"M. Naito et al. · Scientific Reports 13, 13275 · 2023",desc:"GCR によって月面で生成される中性子・ガンマ線の全球線量分布を評価したシミュレーション研究。最大で年間 ~420 mSv 程度の線量となる可能性を示す。遮蔽設計を議論する上で重要なリファレンス。",url:"https://www.nature.com/articles/s41598-023-40405-0"}, {id:"l07",tag:"Model – GEANT4 MIDAS",title:"GEANT4 Study of Miniature Radiation Detector Response in GCR and Inside Spacecraft",meta:"Karafasoulis et al. · SWSC (ESA) · 2022",desc:"小型線量計 MIDAS の GCR 応答を GEANT4 で評価し、月面 LND 測定値と比較して妥当性を検証。月面や宇宙機内部での小型検出器性能評価に直接関連する資料。",url:"https://www.swsc-journal.org/articles/swsc/full_html/2022/01/swsc210031/swsc210031.html"} ] } ] }, /* ═══════════════════════════════════════════════════ GROUP NEW: 有用なツール ═══════════════════════════════════════════════════ */ { id:"g-tools", label:"有用なツール", color:"#0f766e", desc:"放射線環境・影響・LET・シールド解析に用いられるシミュレーションツール・計算コード", collapsed: false, sections: [ { id:"rad-tools", label:"放射線・粒子輸送シミュレーションツール", note:"CREME-MC · SPENVIS · SRIM · PHITS · Geant4 – SEE / TID / シールド・粒子輸送解析", refs:[ {id:"tool01",tag:"CREME-MC – 宇宙放射線・SEE レート計算",title:"CREME-MC: Cosmic Ray Effects on Micro-Electronics (Monte Carlo)",meta:"Vanderbilt University ISDE · オンライン計算ツール · https://creme.isde.vanderbilt.edu/",desc:"宇宙放射線環境における SEE レート（SEU・SEL 等）をモンテカルロ法で計算するオンラインツール。軌道・シールド・デバイスパラメータ（臨界電荷・感受体積）を入力し、GCR・SEP 環境下での SEE 発生率を推定できる。CREME96 の後継として広く使われており、宇宙機器の耐放射線設計における SEE レート評価の標準ツールの一つ。",url:"https://creme.isde.vanderbilt.edu/"}, {id:"tool02",tag:"SPENVIS – 宇宙環境総合解析ポータル",title:"SPENVIS: Space Environment Information System",meta:"ESA / BIRA-IASB · オンライン計算ツール · https://www.spenvis.oma.be/",desc:"ESA が提供する宇宙環境の総合オンライン解析システム。軌道定義・放射線帯モデル（AP-9/AE-9・AP8/AE8・CRRESPRO・FLUMIC）・GCR / SEP フラックス・シールド評価・TID 計算・太陽電池劣化（DDD）・デブリ環境など多様な計算モジュールを提供。宇宙機の放射線環境解析において世界標準のプラットフォーム。登録無料。",url:"https://www.spenvis.oma.be/"}, {id:"tool03",tag:"SRIM – イオン・物質相互作用計算",title:"SRIM (Stopping and Range of Ions in Matter)",meta:"J. F. Ziegler et al. · フリーウェア · http://www.srim.org/",desc:"イオンと物質の相互作用（阻止能・飛程・LET・イオン散乱）を計算するモンテカルロシミュレーションコード。TID 評価でのシールド内エネルギー損失計算、SEE 試験でのイオン種・エネルギー選択時の LET 計算に広く使用される。フリーウェアとして配布されており、放射線効果解析の入門ツールとしても広く普及。",url:"http://www.srim.org/"}, {id:"tool06",tag:"ATIMA – 重イオン阻止能・飛程計算",title:"ATIMA (ATomic Interaction with MAtter)",meta:"H. Weick, H. Geissel et al. · GSI Helmholtzzentrum für Schwerionenforschung · ダルムシュタット",desc:"GSI が開発した重イオンの阻止能（dE/dx）・飛程・エネルギー損失ストラグリング・角度散乱を計算するコード。1 keV/u〜450 GeV/u の広いエネルギー範囲で陽子から重イオン（U まで）に対応し、Lindhard-Sørensenの厳密理論に基づくため高 Z イオンでも精度約 1% を達成。SEE 試験でのイオン種選定における LET 計算・SRIM との相互検証・LISE++ や PHITS のサブルーチンとしても組み込まれている。Geant4 にも ATIMA モデルとして実装済み。SRIM が扱えない高エネルギー重イオン（数百 MeV/u 以上）の阻止能計算において特に有用。catima（C++ 実装）は GitHub（https://github.com/hrosiak/catima）から入手可能。",url:"https://web-docs.gsi.de/~weick/atima/"}, {id:"tool04",tag:"PHITS – 粒子輸送モンテカルロコード",title:"PHITS (Particle and Heavy Ion Transport code System)",meta:"QST / JAEA · 汎用粒子輸送コード · 日本発の国際標準",desc:"QST（量子科学技術研究開発機構）/ JAEA が開発した汎用の粒子・重イオン輸送モンテカルロコード。陽子・中性子・重イオン・光子・電子など多種の粒子輸送を扱い、TID・DDD・SEE 解析のほか、加速器施設の遮蔽設計・宇宙線輸送・生物線量評価まで幅広い分野で使用される。JAEAコードセンター経由で登録配布。",url:"https://phits.jaea.go.jp/"}, {id:"tool05",tag:"Geant4 – 汎用粒子輸送モンテカルロ",title:"Geant4: A Simulation Toolkit",meta:"S. Agostinelli et al. (Geant4 Collaboration) · Nucl. Instrum. Methods A 506 · 2003 · DOI: 10.1016/S0168-9002(03)01368-8",desc:"CERN を中心とした国際コラボレーションが開発したオープンソースの汎用粒子・物質相互作用シミュレーションツール。電磁・ハドロン・光学過程を網羅し、eV から TeV まで広いエネルギー範囲に対応。宇宙放射線シミュレーション（ISS・月面・衛星内部の線量計算）・SEE 解析・シールド設計・検出器シミュレーション・医療物理まで幅広く使用される。PHITS と並ぶ世界標準の粒子輸送コードで、本文献集の MIDAS・REDMoon 等でも採用されている。論文引用数は10万件超（2024年）。",url:"https://geant4.org/"} ] }, { id:"rad-env-models", label:"宇宙放射線環境モデル（標準・規格）", note:"AP-9 / AE-9 捕捉放射線帯 · ISO 15390 GCR · ISO 15391 SEP", refs:[ {id:"ae9ap9",tag:"AP-9 / AE-9 – 捕捉放射線帯モデル（現行標準）",title:"AE9, AP9 and SPM: New Models for Specifying the Trapped Energetic Particle and Space Plasma Environment",meta:"G. P. Ginet et al. · AFRL / MIT LL / Aerospace Corp. · Space Science Reviews 179 · 2013 · DOI: 10.1007/s11214-013-9964-y",desc:"AP-8 / AE-8 の後継として AFRL・NASA が共同開発した捕捉放射線帯モデルの基礎論文。AE-9（電子）・AP-9（陽子）・SPM（プラズマ）の3モデルセットで、Van Allen Probes 等の最新データに基づく。統計的不確かさを Monte Carlo で定量化する点が AP-8 と根本的に異なり、設計マージン評価の精度が向上。AP-8 との差が TID・DDD 設計値に直接影響するため、モデルの選択根拠を示す上で必須の文献。SPENVIS・IRENE ポータルから利用可能。",url:"https://www.vdl.afrl.af.mil/programs/ae9ap9/files/publications/AE9AP9SPM_SSR_Overview.pdf"}, {id:"ae9ap9-portal",tag:"AP-9 / AE-9 – ダウンロードポータル（AFRL）",title:"IRENE-AE9/AP9/SPM Radiation Environment Model – AFRL Portal",meta:"AFRL · vdl.afrl.af.mil · 配布サイト（無料・要登録）",desc:"AP-9/AE-9/SPM モデルのコード・データセット・ユーザーズガイドを無料配布する AFRL 公式ポータル。Windows 版実行ファイルとして提供されており、軌道パラメータを入力して電子・陽子フラックスと統計的不確かさを出力できる。将来バージョンで IRENE モデルへ発展予定。SPENVIS とは独立したスタンドアロン版として使用可能。",url:"https://www.vdl.afrl.af.mil/programs/ae9ap9/"}, {id:"iso15390",tag:"ISO 15390 – GCR モデル（国際標準）",title:"ISO 15390:2004 – Space Environment: Galactic Cosmic Ray Model",meta:"ISO / TC 20/SC 14 · 国際標準化機構 · 2004年（2013年再確認）",desc:"銀河宇宙線（GCR）フラックスの国際標準モデル（Nymmik モデルをベース）。101 MeV〜10⁵ MeV の電子・陽子・Z=2〜92 原子核の近地球空間外でのスペクトルと太陽変調依存性を規定。SPENVIS・CREME-MC が実装しており、宇宙機器の設計根拠文書化に使われる。有償規格だが ISO.org で概要を確認できる。",url:"https://www.iso.org/standard/37095.html"}, {id:"iso15391",tag:"ISO/TS 15391 – SEP モデル（国際標準）",title:"ISO/TS 15391:2009 – Space Environment: Probabilistic Model of Solar Particle Fluxes",meta:"ISO / TC 20/SC 14 · 国際標準化機構 · Technical Specification · 2009年",desc:"太陽エネルギー粒子（SEP）フラックスの確率論的国際標準モデル。ミッション期間・軌道・信頼度を入力して SEP フルエンス（陽子・重イオン）の累積分布関数を出力する Nymmik 確率モデルを規定。SPENVIS が実装。JPL-91 モデルや ESP モデルとともに SEP 設計値の設定に用いられ、設計根拠文書化に不可欠な国際規格。ISO 15390（GCR）と対をなす。",url:"https://www.iso.org/standard/37096.html"} ] } ] }, /* ═══════════════════════════════════════════════════ GROUP 3: 耐放射線関係標準文書 ═══════════════════════════════════════════════════ */ { id:"g-standards", label:"耐放射線関係標準文書", color:"#059669", desc:"NASA / ECSS / JAXA / JEDEC による RHA・EEE Parts・宇宙環境に関する標準規格・設計ガイドライン", collapsed: false, sections: [ { id:"rha-standards", label:"RHA・放射線設計 標準規格", note:"NASA-STD / ECSS / JAXA-JERG / JEDEC – RHA・TID・SEE 設計要求", refs:[ {id:"e02",tag:"ECSS – RHA",title:"ECSS-Q-ST-60-15C – Radiation Hardness Assurance (EEE Components)",meta:"ESA / ECSS · RHA · EEE Components",desc:"EEE 部品に対する Radiation Hardness Assurance（RHA）の標準。SEE / TID を踏まえた部品選定・試験・保証の枠組みを与え、COTS 利用時の追加評価プロセスも規定する。",url:"https://ecss.nl/standard/ecss-q-st-60-15c-rev-1-radiation-hardness-assurance-20-march-2025/"}, {id:"e03",tag:"ECSS – Space Environment",title:"ECSS-E-ST-10-04C – Space Environment",meta:"ESA / ECSS · Space Environment Models · GCR / SPE / Trapped",desc:"ESA ミッションで用いる宇宙環境モデル（GCR, SPE, trapped radiation など）を定義した標準。SEE / TID 解析に用いる「環境モデル」の出発点となる文書。",url:"https://ecss.nl/standard/ecss-e-st-10-04c-rev-1-space-environment-15-june-2020/"}, {id:"e04",tag:"ECSS – Radiation Effects",title:"ECSS-E-ST-10-12C – Methods for the Calculation of Radiation Received and Its Effects, and a Policy for Design Margins",meta:"ESA / ECSS · 2008年11月（Corr.1: 2017年2月）· PDF 直リンク",desc:"宇宙放射線の計算手法と設計マージンのポリシーを定める ECSS 標準。TID / SEE / NIEL（非電離エネルギー損失）の影響をどう計算し、どのような放射線設計マージン（RDM: 通常 ×2）を設定するかの規則を規定する。軌道環境モデルの選択・シールド解析・デバイスレベルの耐性評価から設計マージン適用までの一連のプロセスを体系化。ECSS-E-HB-10-12A ハンドブックと組み合わせて使用するのが標準的。欧州宇宙機器設計において NASA-STD や JAXA-JERG に相当する位置づけの重要文書",url:"https://ecss.nl/wp-content/uploads/2008/11/ECSS-E-ST-10-12C%2815November2008%29Corr.1%2822February2017%29.pdf"}, {id:"e05",tag:"JAXA – 耐放射線設計標準",title:"JAXA-JERG-2-143 耐宇宙環境設計標準（耐放射線設計標準）",meta:"JAXA · 耐放射線設計標準 · 日本語版・英語版あり",desc:"宇宙機・衛星搭載機器の耐放射線設計のための基盤標準文書。TID マージン、SEE（SEU/SEL/SEB/SEFI）設計要求、放射線試験レベルと評価手順などを規定し、JERG-2-141 と組み合わせて具体的な RHA 方針を与える。",url:"https://sma.jaxa.jp/TechDoc/Docs/JAXA-JERG-2-143A.pdf"}, {id:"p04",tag:"JEDEC – SEE Test Standard",title:"Test Procedure for the Management of Single-Event Effects in Semiconductor Devices from Heavy Ion Irradiation, JESD57A",meta:"JEDEC Solid State Technology Association · 2017",desc:"重イオン照射によるシングルイベント効果（SEE）試験の標準手順書。LET の定義、照射条件、エラーカウント方法など SEE 試験の基本を定める。",url:"https://www.jedec.org/standards-documents/docs/jesd-57"}, {id:"p01",tag:"NASA – R&M Standard",title:"NASA Reliability and Maintainability (R&M) Standard for Spaceflight and Support Systems, NASA-STD-8729.1A",meta:"NASA · 2017",desc:"宇宙飛行システムにおける信頼性基準とリスク管理の基礎となる標準規格。",url:"https://standards.nasa.gov/standard/NASA/NASA-STD-87291"}, {id:"p02",tag:"NASA – LEO Radiation",title:"Space Radiation Effects on Electronic Components in Low-Earth Orbit",meta:"NASA Preferred Reliability Practice No. PD-ED-1258 · 1996",desc:"低軌道（LEO）における電子部品への宇宙放射線影響に関する基本ガイドライン。",url:"https://extapps.ksc.nasa.gov/Reliability/Documents/Preferred_Practices/1258.pdf"}, {id:"p03",tag:"NASA – Radiation Design Margin",title:"Radiation Design Margin Requirement",meta:"NASA Preferred Reliability Practice No. PD-ED-1260 · 1996",desc:"放射線設計マージン（Design Margin）の要件定義に関する実務慣行文書。",url:"https://extapps.ksc.nasa.gov/Reliability/Documents/Preferred_Practices/1260.pdf"}, {id:"q14",tag:"RHA NewSpace – Evolution",title:"Radiation Hardness Assurance: Evolving for NewSpace",meta:"NASA Technical Reports Server",desc:"New Space の台頭に伴う RHA 手法の進化とリスク受容に関する主要な議論。民間宇宙開発に対応した保証手法の変化を論じている。",url:"https://ntrs.nasa.gov/"}, {id:"p07",tag:"MEAL – Risk Verification",title:"Guidelines for Verification Strategies to Minimize RISK Based on Mission Environment, -Application and -Lifetime (MEAL)",meta:"O. Gonzales · 2018",desc:"ミッションの環境・用途・寿命（MEAL）に基づいたリスク最小化のための検証戦略ガイドライン。",url:"https://ntrs.nasa.gov/api/citations/20180007359/downloads/20180007359.pdf"} ] }, { id:"eee-parts-std", label:"EEE Parts 保証標準", note:"NASA-STD-8739.10 · EEE-INST-002 · EEE 部品選定・調達・トレーサビリティ", refs:[ {id:"e01",tag:"NASA – EEE Parts Standard",title:"NASA-STD-8739.10 – Electrical, Electronic, and Electromechanical (EEE) Parts Assurance Standard",meta:"NASA · EEE Parts Assurance · COTS / PEMs",desc:"NASA の EEE 部品保証標準。COTS 品やプラスチック封止品（PEMs）を含めた選定・調達・トレーサビリティ・試験・保管・適用方法を定める。COTS メモリ／マイコン利用時のリスク管理とパーツアシュアランスの前提文書。",url:"https://standards.nasa.gov/standard/NASA/NASA-STD-873910"}, {id:"eee-inst002",tag:"NASA – EEE-INST-002（部品選定指針）",title:"EEE-INST-002: Instructions for EEE Parts Selection, Screening, Qualification, and Derating",meta:"NASA GSFC · EEE-INST-002 · Rev. A · 2008年1月",desc:"NASA GSFC が発行する EEE 部品の選定・スクリーニング・資格認定・ディレーティングに関する詳細指針書。放射線耐性評価（TID / SEE / DDD）要求を含む多くの評価要件が規定されており、放射線保証プログラムの実装手順書として機能する。宇宙グレード・MIL グレード・COTS 品のそれぞれに対する要求レベルを体系的に整理。",url:"https://nepp.nasa.gov/pages/EEE-INST-002.cfm"}, {id:"q02",tag:"RHA – Radiation Assurance",title:"Radiation Assurance for the Space Environment",meta:"J. L. Barth, K. A. LaBel and C. Poivey · 2004 International Conference on IC Design and Technology",desc:"宇宙環境における放射線保証の包括的なアプローチについて。",url:"https://ntrs.nasa.gov/api/citations/20040070939/downloads/20040070939.pdf"}, {id:"q07",tag:"SEE Test – Adequacy",title:"Are Current SEE Test Procedures Adequate for Modern Devices and Electronics Technologies?",meta:"K. A. LaBel et al. · 2008",desc:"最新の半導体技術に対する既存の SEE 試験手順の妥当性を問う、試験法見直しのための重要資料。",url:"https://radhome.gsfc.nasa.gov/radhome/papers/HEART08_LaBel.pdf"} ] }, { id:"rad-test-methods", label:"放射線試験方法規格（TID / SEE / DDD）", note:"MIL-STD-883 / MIL-STD-750 / ESCC 22900 / ESCC 25100 / ESCC 22500", refs:[ {id:"mil883-1019",tag:"MIL-STD-883 Method 1019 – TID（IC）",title:"MIL-STD-883 Method 1019: Ionizing Radiation (Total Dose) Test Procedure",meta:"DLA Land and Maritime · MIL-STD-883 · IC（集積回路）用 TID 試験方法",desc:"集積回路（IC）の総電離線量（TID）試験方法を規定する MIL-STD-883 の Method 1019。Co-60 ガンマ線源または X 線源を使用し、バイアス条件・線量率・評価パラメータ・試験レポート要件を定める。宇宙用 IC の TID 評価において最も広く参照される試験規格の一つ。",url:"https://landandmaritimeapps.dla.mil/programs/MilSpec/ListDocs.aspx?BasicDoc=MIL-STD-883"}, {id:"mil750-1019",tag:"MIL-STD-750 Method 1019 – TID（ディスクリート）",title:"MIL-STD-750 Method 1019: Ionizing Radiation (Total Dose) Test Procedure",meta:"DLA Land and Maritime · MIL-STD-750 · ディスクリート半導体デバイス用 TID 試験方法",desc:"ディスクリート半導体デバイス（トランジスタ・ダイオード等）の TID 試験方法を規定する MIL-STD-750 の Method 1019。IC 向けの MIL-STD-883 Method 1019 と対をなす規格で、ディスクリート品の放射線耐性評価に適用される。同文書内に SEE 試験の Method 1080 も収録されている。",url:"https://landandmaritimeapps.dla.mil/programs/MilSpec/ListDocs.aspx?BasicDoc=MIL-STD-750"}, {id:"escc22900",tag:"ESCC 22900 – TID 試験方法（欧州標準）",title:"ESCC Basic Specification No. 22900: Total Dose Steady-State Irradiation Test Method",meta:"ESA / European Space Components Coordination · Issue 5 · 2016年6月",desc:"ESA が定める宇宙用部品の TID 試験標準。Co-60 線源による定常照射試験の手順・バイアス条件・試験計画・評価・レポート要件を規定。ESCC 評価・認定品に求められる試験規格であり、欧州宇宙機器の TID 評価において MIL-STD-883 Method 1019 に相当する位置づけ。",url:"https://escies.org/escc-specs/published/22900.pdf"}, {id:"escc25100",tag:"ESCC 25100 – SEE 試験方法（欧州標準）",title:"ESCC Basic Specification No. 25100: Single Event Effects Test Method and Guidelines",meta:"ESA / European Space Components Coordination",desc:"ESA が定める宇宙用部品の SEE 試験標準。重イオン・陽子による SEE（SEU / SEL / SEB / SEFI 等）の試験手順・LET 範囲・フルエンス要件・評価方法・試験レポート要件を規定。ESCC 認定品の SEE 評価に必須の欧州標準規格。",url:"https://spacecomponents.org/specification/view?id=3095"}, {id:"escc22500",tag:"ESCC 22500 – 変位損傷（DDD）試験ガイドライン",title:"ESCC Basic Specification No. 22500: Guidelines for Displacement Damage Irradiation Testing",meta:"ESA / European Space Components Coordination · Issue 2 · 2021年10月",desc:"変位損傷線量（DDD）試験のガイドラインを定める ESCC 標準。陽子・中性子・電子・重イオンによる NIEL（非電離エネルギー損失）の評価方法・試験手順・等価フルエンスの計算方法を規定。太陽電池・光検出器・CCD など NIEL 感受性の高いデバイスの評価に適用。",url:"https://escies.org/specification/viewapppub?id=4322"} ] } ] }, /* ═══════════════════════════════════════════════════ GROUP 2: 放射線試験機関 ═══════════════════════════════════════════════════ */ { id:"g-facilities", label:"放射線試験機関", color:"#7c3aed", desc:"CERN / BNL / Fermilab / SLAC / KEK / J-PARC における SEE・TID 試験環境と施設ガイド", collapsed: false, sections: [ { id:"co60-japan", label:"国内 Co-60 TID 試験施設", note:"ガンマ線 TID 試験専用施設（Co-60 線源）", refs:[ {id:"co60-qst",tag:"QST高崎 – コバルト棟",title:"QST 高崎量子応用研究所 コバルト60 照射施設",meta:"量子科学技術研究開発機構（QST）高崎量子応用研究所 · 群馬県高崎市",desc:"QST 高崎（旧 JAEA 高崎）のコバルト棟。Co-60 線源によるガンマ線照射（総電離線量 TID 試験）施設。TIARA の荷電粒子ビームと組み合わせることで、同一機関内で SEE と TID の両方を評価できる。宇宙用電子機器の放射線耐性評価に実績あり。施設利用申請制度あり。",url:"https://www.qst.go.jp/site/taka-shisetsuka/2103.html"}, {id:"co60-titech",tag:"東京科学大 – Co-60 照射施設",title:"東京科学大学 Co-60 照射施設（工学院）",meta:"東京科学大学（旧 東京工業大学）· 工学院研究科 · 東京",desc:"東京科学大学の Co-60 ガンマ線照射施設。IC・センサ・素子の TID 試験に利用されており、大学附属施設として学術研究から産業応用まで幅広く提供している。",url:"https://www.zc.iir.titech.ac.jp/Co60/"}, {id:"co60-nagoya",tag:"名古屋大学 – Co-60 照射施設",title:"名古屋大学 Co-60 照射施設",meta:"名古屋大学 · 核理工学研究施設 · 名古屋",desc:"名古屋大学核理工学研究施設の Co-60 ガンマ線照射施設。宇宙用・産業用デバイスの TID 試験に提供。線量率・総線量の調整が可能で、電子機器の放射線耐性評価に利用されている。",url:"https://co60.nucl.nagoya-u.ac.jp/index.html"}, {id:"co60-kyushu",tag:"九州大学 – Co-60 照射施設",title:"九州大学 Co-60 照射施設（CABAS）",meta:"九州大学 応用力学研究所 · 福岡 · CABAS",desc:"九州大学応用力学研究所の Co-60 ガンマ線照射施設 CABAS。宇宙用部品・電子機器の TID 試験・材料の照射研究に提供。九州地区における主要な TID 試験施設。",url:"https://www.cabas.kyushu-u.ac.jp/cobalt/"} ] }, { id:"japan-facilities", label:"日本の放射線試験施設", note:"QST高崎 TIARA · 大阪大学 RCNP · 若狭湾エネルギー研究センター · 東北大学 RARiS · KEK / J-PARC", refs:[ {id:"qst01",tag:"QST高崎 – TIARA",title:"イオン照射研究施設（TIARA）– QST 高崎量子技術基盤研究所",meta:"QST 高崎量子技術基盤研究所 · TIARA · 施設供用制度",desc:"Takasaki Ion Accelerators for Advanced Radiation Application（TIARA）。AVFサイクロトロン・タンデム加速器・シングルエンド加速器・イオン注入装置の4種類のイオン加速器を備え、数万 eV から数億 eV の広いエネルギー範囲の多種イオンを供給できる。宇宙機器用半導体の SEE / TID 試験にも利用可能。外部利用は施設供用制度を通じて申請する。",url:"https://www.qst.go.jp/site/taka-riyoukanri/2163.html"}, {id:"rcnp01",tag:"阪大 RCNP – サイクロトロン施設",title:"大阪大学 核物理研究センター（RCNP）サイクロトロン施設",meta:"Research Center for Nuclear Physics, Osaka University · AVF + Ring Cyclotron",desc:"K140 AVFサイクロトロン（1973年稼働）と K400 リングサイクロトロン（1991年稼働）の2段カスケード構成。陽子最大 420 MeV・重イオン最大 100 MeV/u を供給。エネルギー広がり ΔE/E ≈ 10⁻⁴ の高品質ビームが特長。半導体デバイスの SEE / NIEL 試験に利用可能な共同利用・共同研究拠点。",url:"https://www.rcnp.osaka-u.ac.jp/Divisions/np1-a/RCF/RCNPCF-ACj.html"}, {id:"werc01",tag:"若狭湾エネルギー研究センター",title:"若狭湾エネルギー研究センター（WERC）イオン加速器施設",meta:"公益財団法人 若狭湾エネルギー研究センター · 福井県敦賀市 · タンデム加速器 + シンクロトロン",desc:"タンデム加速器（最大ターミナル電圧 5 MV）とシンクロトロン加速器（陽子 200 MeV）を中核装置とする多目的イオン加速器システムを保有。宇宙機器の放射線耐性評価研究に活用されており、JAXA との研究連携・協力覚書を締結。水素・ヘリウム・炭素等の荷電粒子イオンビームによる SEE / TID 試験が可能。外部利用は依頼照射制度による。",url:"https://www.werc.or.jp/outline/shisetsu/kasokuki/"}, {id:"raris01",tag:"東北大学 RARiS – 半導体照射試験装置",title:"東北大学 先端量子ビーム科学研究センター（RARiS）半導体照射試験装置",meta:"Research Center for Accelerator and Radioisotope Science, Tohoku University · 青葉山事業所 · AVFサイクロトロン",desc:"2024年4月に電子光理学研究センターとサイクロトロン・ラジオアイソトープセンターを統合して設置。青葉山事業所の AVFサイクロトロン（最大 100 MeV 重イオン）からの陽子・重イオン・中性子を用いた宇宙環境模擬半導体照射試験装置を備える。ビーム強度・均一性・エネルギー可変を確保した SEE 試験環境で、陽子 107 /cm²·s・重イオン 104 /cm²·s 程度のフルエンス率を実現。",url:"https://www.raris.tohoku.ac.jp/facility/aobayama/semiconductor/"}, {id:"ribf01",tag:"理研 RIBF – 重イオン SEE 施設供用",title:"理化学研究所 RIBF（RI ビームファクトリー）施設供用",meta:"理化学研究所 仁科加速器研究センター · 和光 · SRC / BigRIPS",desc:"世界最高強度の重イオンビームを提供する理研の RI ビームファクトリー（RIBF）。超伝導リングサイクロトロン（SRC）を核とし、最大 345 MeV/u の重イオン（Ar〜U）を生成。半導体・電子機器の放射線損傷評価（SEE・TID）での施設供用実績がある。一般共同研究・施設利用申請制度あり。",url:"https://ribf.riken.jp/sisetu-kyoyo/HIbeam/f"}, {id:"himac01",tag:"QST 放医研 HIMAC – 重粒子線照射",title:"QST 放射線医学研究所 HIMAC（Heavy Ion Medical Accelerator in Chiba）",meta:"量子科学技術研究開発機構（QST）放射線医学研究所 · 千葉 · 重粒子線がん治療装置",desc:"QST 放医研の重粒子線がん治療施設 HIMAC。炭素イオン（C-12）を中心に最大 800 MeV/u 相当の重イオンビームを提供。医療用途が主であるが、半導体デバイスの SEE 試験・放射線損傷評価への施設供用実績がある。高エネルギー重イオンを必要とする宇宙機器評価に利用可能。",url:"https://www.qst.go.jp/site/iqms-kyoyo/1870.html"}, {id:"rcnp-wn",tag:"大阪大学 RCNP – 白色中性子ビームライン（宇宙線 SEE 試験）",title:"RCNP 大阪大学 核物理研究センター – 白色中性子ビームライン（RCNPCF-WNt）",meta:"大阪大学 核物理研究センター（RCNP）· 豊中 · AVF + Ring サイクロトロン · 白色中性子",desc:"大阪大学 RCNP の白色中性子ビームライン（RCNPCF-WNt）は、LANSCE/WNR の ICE House と類似した宇宙線誘起中性子スペクトルを提供する国内唯一の高エネルギー白色中性子施設。385 MeV/nucleon の重イオン一次ビームを用いた白色中性子で、エネルギー範囲は数 MeV〜数百 MeV。地上宇宙線中性子による半導体ソフトエラー（SER / SEE）の加速試験に使用され、国内の半導体・電子機器メーカーが宇宙線耐性評価に広く利用している。施設共用申請制度あり。",url:"https://www.rcnp.osaka-u.ac.jp/Divisions/np1-a/RCF/RCNPCF-WNt.html"} ] }, { id:"us-facilities", label:"米国の放射線試験施設", note:"BNL（NSRL / SEUTF / HEET）· LBNL BASE · TAMU · MGH Francis Burr · Fermilab / SLAC", refs:[ {id:"tamu01",tag:"TAMU – Radiation Effects Facility",title:"Texas A&M University Cyclotron Institute – Radiation Effects Facility (REF)",meta:"Texas A&M University · K500 + K150 サイクロトロン · College Station, TX",desc:"K500 超伝導サイクロトロン（最大 60 MeV/u 重イオン）と K150 サイクロトロン（陽子 6.3–45 MeV・軽重イオン）の2本の専用ビームラインを持つ。LET 0.1–99.8 MeV·cm²/mg の広範な重イオンカクテルと SEE 試験用 SEUSS ソフトウェアを提供。「世界の放射線効果試験をリードする」と自称し、全米でも最大規模の商業 SEE 試験施設の一つ。",url:"https://cyclotron.tamu.edu/ref/heavy_ions.html"}, {id:"lbnl-base",tag:"LBNL – BASE（Berkeley Accelerator Space Effects）",title:"Lawrence Berkeley National Laboratory 88-Inch Cyclotron – BASE Facility",meta:"Lawrence Berkeley National Laboratory · DOE · Berkeley, CA",desc:"88インチサイクロトロン（K=140）に付属する宇宙放射線効果試験施設。1979年に世界初の重イオン SEE 試験を実施した歴史を持つ。陽子（最大 60 MeV）・重イオン（水素〜ウラン、最大エネルギーはイオン種依存）・中性子ビームを提供し、GPS・ロケット・衛星の電子機器試験で豊富な実績がある。",url:"https://cyclotron.lbl.gov/base-rad-effects"}, {id:"b01",tag:"BNL – SEUTF（重イオン SEE 専用）",title:"Tandem Van de Graaff Accelerator Facility – Fact Sheet (SEUTF)",meta:"BNL · Tandem Van de Graaff · Single Event Upset Test Facility · Upton, NY",desc:"1 MeV プロトンから 337 MeV 金イオンまで 50 種類以上のイオン種を提供。LET 0.01–91 MeV·cm²/mg をカバーする重イオン SEE 試験専用施設（SEUTF）として広く利用されている。NSRL とは独立した施設。",url:"https://www.bnl.gov/newsroom/factsheets/files/pdf/tvdg.pdf"}, {id:"b02",tag:"BNL – NSRL（NASA宇宙放射線研究所）",title:"NASA Space Radiation Laboratory (NSRL) – User Information",meta:"BNL / NASA · NSRL · Space Radiation Simulation · Upton, NY",desc:"宇宙線を模擬した高エネルギーイオンビームを提供する NASA Space Radiation Laboratory（NSRL）。BNL のブースター加速器から高エネルギー重イオン（Fe, Si, O など）と陽子を供給。生物影響試験が主目的だが電子機器の TID / SEE 試験にも利用可能。2020年に GCR シミュレーターを開発し、33 イオン種シーケンス照射による宇宙放射線模擬が可能になった。",url:"https://www.bnl.gov/nsrl/"}, {id:"q03",tag:"BNL – NSRL First Run",title:"Results of the First Run of the NASA Space Radiation Laboratory at BNL",meta:"K. A. Brown et al. · Proceedings of EPAC 2004",desc:"BNL の NSRL 施設稼働初期の成果と加速器性能に関する報告。ビームエネルギーや線量率の実測値を含む。",url:"https://accelconf.web.cern.ch/e04/papers/TUPLT181.pdf"}, {id:"q04",tag:"BNL – NSRL Beam Transfer",title:"Results from the Commissioning of the NSRL Beam Transfer Line at BNL",meta:"N. Tsoupas et al. · Proceedings of EPAC 2004",desc:"NSRL のビーム輸送ラインと照射野の均一性技術に関する技術報告。",url:"https://accelconf.web.cern.ch/e04/papers/TUPLT180.pdf"}, {id:"q05",tag:"BNL – GCR Simulator",title:"NASA's First Ground-Based Galactic Cosmic Ray Simulator",meta:"L. C. Simonsen et al. · PLOS Biol. 18 · 2020",desc:"BNL NSRL における「GCR シミュレーター（銀河宇宙線模擬装置）」の開発と運用に関する重要論文。GCR スペクトルを模擬した多イオン種シーケンス照射プロトコルを確立し、電子機器試験への応用可能性を示している。",url:"https://journals.plos.org/plosbiology/article?id=10.1371/journal.pbio.3000669"}, {id:"b03",tag:"BNL – HEET 構想",title:"Proposal for a High-Energy Effects Testing Facility (HEET) at RHIC",meta:"BNL · RHIC · RADNEXT / ESA Workshop",desc:"RHIC ビームを利用して、高エネルギー二次ハドロン場による SEE 試験を行う HEET 構想を説明した資料。HL-LHC / FCC など将来コライダーで必要となる高エネルギーハドロン SEE 試験の要求を議論。",url:"https://indico.cern.ch/event/1007775/contributions/4224412/attachments/2187033/3696709/RADNEXT_HEET_BNL.pdf"}, {id:"mgh01",tag:"MGH Francis Burr – 陽子線 SEE 試験",title:"Francis H. Burr Proton Therapy Center, Massachusetts General Hospital",meta:"MGH / Harvard · IBA サイクロトロン · Boston, MA",desc:"医療用陽子線治療施設だが、70–230 MeV の陽子ビームを SEE 試験にも提供。NASA NSREC データワークショップの複数論文で試験施設として引用されている。サリー大学の OSSAT プロセッサ試験（SAMV71/STM32H7/SAMA5D3）でも利用された REEF と同様に、医療施設を SEE 試験に転用する代表例。",url:"https://www.massgeneral.org/cancer-center/radiation-oncology/treatments-and-services/proton-therapy/"}, {id:"lansce",tag:"LANSCE WNR – 高エネルギー白色中性子 SEE 試験",title:"LANSCE Weapons Neutron Research (WNR) Facility – Radiation Effects Testing",meta:"Los Alamos National Laboratory · Los Alamos, NM · 800 MeV LINAC · ICE House / ICE-II フライトパス",desc:"LANL の LANSCE（Los Alamos Neutron Science Center）WNR 施設は、宇宙線誘起中性子に類似したエネルギースペクトル（0.1〜600 MeV）の白色中性子ビームを提供する世界屈指の中性子 SEE 試験施設。ICE House（FP-30L）と ICE-II（FP-30R）の2フライトパスで加速度試験（大気中の100万倍以上のフラックス）が可能。大阪大学 RCNP の白色中性子ビームラインと類似のスペクトルを持ち、国際的な SEE 試験の標準施設として広く使用される。国際ユーザー制度あり（年次プロポーザル募集）。",url:"https://lansce.lanl.gov/facilities/wnr/index.php"} ] }, { id:"eu-facilities", label:"ヨーロッパの放射線試験施設", note:"CERN（CHARM / VESPER / H8）· PSI PIF · UCL HIF · RADEF · Surrey REEF · ESTEC CASE · Trento", refs:[ {id:"pif01",tag:"PSI – PIF（陽子照射施設）",title:"Proton Irradiation Facility (PIF) – Paul Scherrer Institut",meta:"Paul Scherrer Institut (PSI) · スイス・ビリゲン · 最大 230 MeV 陽子",desc:"PSI のアイソクロナスサイクロトロンに接続した専用陽子照射施設。100 MeV および 230 MeV の陽子ビームを提供し、宇宙用電子機器の SEE（陽子誘起）試験に広く利用される。RADEF・UCL HIF と並んで欧州 ESA ECIF に認定された主要施設の一つ。ZU3EG 試験（JUICE 論文）でも使用。",url:"https://www.psi.ch/en/pif"}, {id:"hif01",tag:"UCL HIF – 重イオン照射施設",title:"Heavy Ion Facility (HIF) – Université catholique de Louvain",meta:"UCL Cyclotron Resource Centre · ベルギー・ルーバン＝ラ＝ヌーヴ · サイクロトロン",desc:"UCL のサイクロトロンを利用した重イオン照射施設（HIF）および軽イオン施設（LIF）。標準的な重イオンカクテル（H〜Xe）によるSEE試験を提供。多くの ESA ミッション機器試験に使用されており、SEFUW 2018 の ZU3EG 試験（Glorieux 2018）でも利用。",url:"https://www.uclouvain.be/en/research-institutes/irmp/heavy-ion-facility-hif"}, {id:"radef01",tag:"RADEF – 放射線効果施設（フィンランド）",title:"RADiation Effects Facility (RADEF) – University of Jyväskylä",meta:"University of Jyväskylä (JYFL) · フィンランド · ESA ECIF 認定（2005年〜）",desc:"K-130 サイクロトロン + ECR イオン源による高透過重イオンカクテル（10 / 16.3 / 22 MeV/n、最大 Au イオン）・陽子・電子（LINAC）を提供する ESA 認定欧州部品照射施設（ECIF）。2005年から ESA との契約を継続中（2027年まで延長）。NASA・JAXA・CNES も利用。ZU3EG 試験（低エネルギー陽子・重イオン）や JUICE ミッション機器評価でも使用。",url:"https://www.jyu.fi/en/science/accelerator-laboratory/facilities-and-instruments/radiation-effects-facility"}, {id:"reef01",tag:"Surrey REEF – 電子線 TID・内部帯電試験",title:"Realistic Electron Environment Facility (REEF) – University of Surrey",meta:"Surrey Space Centre · University of Surrey · イギリス",desc:"Sr-90（半減期 28 年）ベータ線源を用いた電子線照射施設。GEO 放射線帯の電子環境を真空チャンバー内で長期間模擬し、TID 試験および内部帯電（IEDEP）試験を実施。OSSAT の SAMV71/STM32H7/SAMA5D3 試験（KISPE 2021）で使用された試験装置「REEF」がこれに相当する。",url:"https://www.surrey.ac.uk/surrey-space-centre"}, {id:"estec-case",tag:"ESA ESTEC – CASE（Californium-252 線源）",title:"The CASE System – Californium-252 Radiation Facility at ESA ESTEC",meta:"ESA ESTEC · TEC-QEC · オランダ・ノールドウェイク · Cf-252 線源",desc:"ESA の ESTEC（欧州宇宙研究技術センター）に設置された Californium-252 中性子・ガンマ線照射施設 CASE。宇宙用部品の放射線特性評価に使用される。ESCIES（欧州宇宙部品情報交換システム）で詳細情報が公開されている。",url:"https://escies.org/webdocument/showArticle?id=252&groupid=6"}, {id:"trento01",tag:"Protonterapia Trento – 陽子線試験施設",title:"Centro di Protonterapia – Trento（イタリア）",meta:"APSS / Trento · イタリア · 陽子線治療施設 · ESA 試験実績あり",desc:"イタリア・トレント県の陽子線治療施設。MGH Francis Burr と同様に医療用陽子ビームを宇宙用電子機器の放射線試験（SEE / TID）にも提供。ESA の試験プロジェクトで利用実績があり、ヨーロッパにおける陽子線 SEE 試験のオルタナティブ施設として機能している。",url:"https://www.apss.tn.it/servizi/Centro-di-Protonterapia"} ] }, { id:"see-facilities", label:"SEE 試験施設サーベイ & 利用ガイド", note:"複数ラボにまたがる施設比較 · 宇宙環境と加速器ビームの対応づけ", refs:[ {id:"g01",tag:"Survey – US / Europe",title:"Overview of Single-Event Effects Test Facilities and Beam Characteristics",meta:"RADNEXT / ESA / NASA · Facility Survey",desc:"CERN, BNL, LBNL, RADEF など世界各地の SEE 試験施設のビームパラメータ（粒子種・LET・エネルギー・フルエンス）をまとめたサーベイ。宇宙ミッション・加速器実験のどちらの RHA にも有用な「カタログ」。",url:"https://radnext.web.cern.ch/"}, {id:"g02",tag:"Guide – Space & Accelerators",title:"Using Accelerator Facilities for Space Radiation Effects Testing of Electronics",meta:"NASA / ESA Joint Guides · SEE / TID / NIEL",desc:"宇宙環境（GCR / SPE / トラップ帯）を加速器ビームでどう模擬し、半導体・LSI の SEE / TID / NIEL 試験に用いるかを解説したガイド文書。ビーム条件と宇宙環境との対応づけの考え方を整理するのに適している。",url:"https://trs.jpl.nasa.gov/bitstream/handle/2014/45022/10-1415_A1b.pdf"}, {id:"q08",tag:"SEE Facility – SRHEC AoA",title:"Strategic Radiation-Hardened Electronics Council (SRHEC) Public Summary from Analysis of Alternatives for Domestic SEE Test Facilities",meta:"J. Franco and J. Ross · 2021",desc:"米国内の SEE 試験施設の不足と、高エネルギー重イオン照射施設の必要性に関する分析。",url:"https://nepp.nasa.gov/workshops/dhesee2021/talks/6a_SEE%20AoA%20summary%20Nov%202020%20approved%20for%20release.pdf"} ] } ] }, /* ═══════════════════════════════════════════════════ GROUP 4: 耐放射線部品 ═══════════════════════════════════════════════════ */ { id:"g-parts", label:"耐放射線部品研究論文", color:"#d97706", desc:"COTS 評価・RHA 研究論文・低温エレクトロニクス・シールド技術に関する文献。RADECS・NSREC の主要論文誌も含む", collapsed: false, sections: [ { id:"cots-rha-method", label:"COTS 評価方法論・RHA 研究", note:"COTS 利用の方法論・ハードネス保証の基礎・試験手順の妥当性", refs:[ {id:"q01",tag:"COTS – Radiation (Pioneer)",title:"Use of COTS Microelectronics in Radiation Environments",meta:"P. S. Winokur et al. · IEEE Trans. Nucl. Sci. 46 · 1999 · DOI: 10.1109/23.819113",desc:"放射線環境下での民生品（COTS）利用に関する先駆的な研究と保証手法。ハードネス保証・システムハードニング技術・ライフサイクルコストのトレードオフを体系的に論じた COTS 利用の基礎論文。",url:"https://ieeexplore.ieee.org/document/819113/"}, {id:"q09",tag:"RHA – Testing Review",title:"Radiation Hardness Assurance Testing of Microelectronic Devices: Radiation Environments, Physical Mechanisms, and Foundations",meta:"J. R. Schwank et al. · IEEE Trans. Nucl. Sci. 60 · 2013 · DOI: 10.1109/TNS.2013.2254722",desc:"放射線耐性保証試験の物理的メカニズムと基礎に関する包括的なレビュー。TID / SEE の発生機構から試験手順まで体系的に解説。",url:"https://ieeexplore.ieee.org/document/6530780/"}, {id:"q11",tag:"CMOS – Radiation Challenges",title:"Current and Future Challenges in Radiation Effects on CMOS Electronics",meta:"P. E. Dodd et al. · IEEE Trans. Nucl. Sci. 57 · 2010 · DOI: 10.1109/TNS.2010.2042613",desc:"CMOS エレクトロニクスの放射線影響に関する現在および将来の課題をまとめた論文。技術スケーリングに伴う TID 耐性の変化と SEE への影響、ナノスケールでのハードニング手法の課題を体系的に論じている。",url:"https://ieeexplore.ieee.org/document/5550487/"}, {id:"corha01",tag:"ESA CORHA – COTS 網羅的評価",title:"Radiation screening of COTS components and verification of COTS RHA approach (CORHA)",meta:"C. Tscherne, P. Beck et al. · Seibersdorf Laboratories / Univ. Padova / ESA · TEC-QEC Final Presentation Days, ESTEC · 2023年6月29日",desc:"ESA が資金提供した CORHA プロジェクトの最終成果報告。マイコン・オペアンプ・マルチプレクサなど13種類以上の COTS 部品に対する TID（Co60, Seibersdorf 施設）および SEE 試験結果を網羅的に評価・報告。COTS 部品に対するアドホック RHA アプローチの提案も含む。CubeSat・ニュースペース向け COTS 採用の可否判断に直接役立つ一次資料。",url:"https://indico.esa.int/event/444/contributions/7793/attachments/5317/8527/Tscherne_CORHA_ESA_FPD_v1.0.pdf"} ] }, { id:"cots-processor", label:"COTS プロセッサの放射線試験", note:"SAMV71 / STM32H7 / SAMA5D3 – TID 試験レポート（Open Source Satellite Programme）", refs:[ {id:"kispe01",tag:"KISPE OSSAT – TID 比較試験",title:"Results from Testing Low-Cost, High-Performance Terrestrial Processors for Use in Low-Cost High-Performance Space Missions",meta:"A. Bernie, P. Madle et al. · KISPE Space / Univ. of Surrey · SSC 2021 (SmallSat Conference)",desc:"SAMV71（~60 kRad で故障開始）・STM32H7（~47 kRad）・SAMA5D3（120 kRad 超）の3種 COTS プロセッサを Surrey 大学と共同で電子線 TID 試験。消費電力変動・エラー自動回復・ファイルシステム性能も評価。800 km 太陽同期軌道での 10 年ミッション（想定 TID: ~10 kRad）に対して3種とも候補として妥当と結論。",url:"https://digitalcommons.usu.edu/smallsat/2021/all2021/123/"}, {id:"samv71-01",tag:"OSSAT – SAMV71 詳細レポート",title:"SAMV71 Radiation Test Report (Open Source Satellite Programme)",meta:"KISPE Space / Open Source Satellite Programme · KS-DOC-01250",desc:"800 km 太陽同期軌道・10 年ミッション（想定 TID: ~10 kRad）を前提とした SAMV71 の詳細試験レポート。最大 95 kRad まで段階的に照射し、消費電流・ECC・AES・SD カード・UART 等の機能ごとに劣化を評価。エラーの自動修復（Cortex-M7 ECC）の実証データを含む。STM32H7（KS-DOC-01251）および SAMA5D3（KS-DOC-01252）の個別レポートも同サイトから入手可能。",url:"https://www.opensourcesatellite.org/downloads/KS-DOC-01250_SAMV71_Radiation_Test_Report.pdf"} ] }, { id:"cots-fpga-digital", label:"COTS FPGA・デジタル部品の SEE 試験", note:"SRAM FPGA の SEU 特性・緩和手法・高エネルギー電子による SEE 評価", refs:[ {id:"q10",tag:"IEEE – Low-Energy Protons",title:"Criticality of Low-Energy Protons in Single-Event Effects Testing of Highly-Scaled Technologies",meta:"J. A. Pellish et al. · IEEE Trans. Nucl. Sci. 61 · 2014",desc:"微細化プロセスにおける低エネルギー陽子の SEE への影響と試験における重要性を論じた論文。32 nm SOI CMOS での測定データを示し、2 MeV 以下の陽子成分を含む試験の重要性を実証。",url:"https://ntrs.nasa.gov/archive/nasa/casi.ntrs.nasa.gov/20150000377.pdf"}, {id:"fpga01",tag:"SRAM FPGA – SEU 解析と緩和手法",title:"Single Event Effects in SRAM based FPGA for space applications: Analysis and Mitigation",meta:"R. Weigand · ESA Microelectronics Section · DSNOC 2009",desc:"SRAMベース FPGA における SEU のメカニズム、CREME96 を用いた SEU レート計算、TMR（三重冗長化）・FTMR（機能的 TMR）などの緩和手法を解説したプレゼンテーション。参考文献には CREME96（https://creme96.nrl.navy.mil/）・PSI PIF（陽子線試験）・UCL HIF（重イオン試験）の URL が明記されており、宇宙用 FPGA 設計の入門資料として有用。",url:"http://microelectronics.esa.int/papers/DSNOC2009-SEE-SRAM-FPGA-RolandWeigand-Slides-V1.0.pdf"}, {id:"stratix01",tag:"Stratix 10 FPGA – 中性子 SEE",title:"Single-Event Characterization of a Stratix 10 FPGA Using Neutron Irradiation",meta:"NSF SHREC / Brigham Young Univ. · IEEE NSREC 2019 · DOI: 10.1109/NSREC.2019.8906534",desc:"Intel 14 nm FinFET プロセスの Stratix 10（1SG280LU）FPGA に対して中性子照射 SEU 試験を実施。Configuration RAM の SEU 断面積を推定し、ニューヨーク市相当の中性子フルエンスで 3.2 FIT/Mbit（Config SRAM）・7.1 FIT/Mbit（Block RAM）と定量化。14 nm 世代 FPGA のナノスケール SEU 特性の基礎データ。",url:"https://ieeexplore.ieee.org/abstract/document/8906534/"}, {id:"juice01",tag:"JUICE – 高エネルギー電子 SEE リスク評価",title:"Risk assessment of SEE events due to high energy electrons during the JUICE mission",meta:"ESA TEC-QEC Final Presentation Days, ESTEC · 2023年6月29日",desc:"Zynq UltraScale+（ZU3EG）・SAM V71 などを対象に、高エネルギー電子・陽子・重イオン照射による SEE 発生率を評価。CERN VESPER（高エネルギー電子）・PSI PIF（陽子）・RADEF（低エネルギー陽子・重イオン）での試験結果をもとに、LEO・GEO・木星軌道環境での SEU レートを比較した。電子直接イオン化による SEU の寄与を定量的に示した希少な資料。ZU3EG の全電源ドメインにおける SEL 評価・HDIO 最大電圧バイアス下での重イオン（Xe/Ni）照射によるハードダメージ発見・CRAM/BRAM/FF/DistRAM/TMR 各メモリの SEU 断面積比較データも含む。",url:"https://indico.esa.int/event/444/contributions/7802/attachments/5319/8529/4.Risk%20Assessment%20of%20SEE%20Events%20due%20to%20High%20Energy%20Electrons%20during%20the%20Juice%20Mission.pdf"}, {id:"zu3eg-sefuw",tag:"ZU3EG MPSoC – 重イオン・高エネルギー電子 SEE 詳細",title:"Single Event Characterization of a Xilinx UltraScale+ MP-SoC FPGA (SEFUW 2018)",meta:"M. Glorieux, T. Lange et al. · IROC Technologies / ESA / CERN · SpacE FPGA Users Workshop (SEFUW), ESTEC · 2018年4月",desc:"ZU3EG MP-SoC を UCL 標準重イオン・CERN SPS 超高エネルギー Xe ビーム・高エネルギー電子（VESPER）で照射した SEE 総合試験のスライド。全19電源ドメインの SEL 監視・CRAM/BRAM/DistRAM/FF の SEU 断面積・ARM R5 COREMARK/Pi FFT 機能テスト結果を網羅。16 nm FinFET の低 SEU 感度とともに、HDIO 3.3 V バイアス + 高 LET 重イオン照射時のハードダメージ（回復不能損傷）を初めて報告した資料。SEL は VCC_AUXIO 電源に支配的で、高エネルギー電子に対しては SEL 感度なし。",url:"https://indico.esa.int/event/232/contributions/2162/attachments/1815/2115/SEFUW2018_SEEXCZU3EG_ThomasLange.pdf"}, {id:"maillard17",tag:"ZU3EG – 中性子・陽子・アルファ SEE",title:"Neutron, 64 MeV Proton & Alpha Single-Event Characterization of Xilinx 16nm FinFET Zynq UltraScale+ MPSoC",meta:"P. Maillard, M. Hart et al. · Xilinx · IEEE NSREC 2017 · DOI: 10.1109/TNS.2017.2769127",desc:"XCZU9EG（ZU9EG）を中性子・64 MeV 陽子・熱中性子・アルファ線で照射した SEE 特性評価。16 nm FinFET の BRAM が 65 nm / 28 nm より SEU 感度が低いことを実測で示す。SEM-IP による CRAM スクラビングの効果も検証。ZU3EG と同一アーキテクチャファミリーの基礎データとして JUICE 論文でも引用されている。",url:"https://ieeexplore.ieee.org/document/8115449/"}, {id:"glorieux18",tag:"ZU3EG – 重イオン SEL / SEU（通常 + 超高エネルギー）",title:"Single-Event Characterization of Xilinx UltraScale+ MPSOC under Standard and Ultra-High Energy Heavy-Ion Irradiation",meta:"M. Glorieux et al. · IROC Technologies / ESA / CERN · IEEE NSREC 2018 · DOI: 10.1109/TNS.2018.2874197",desc:"UCL 標準重イオンと CERN SPS 超高エネルギー Xe ビームによる SEL / SEU 断面積の測定。超高エネルギーイオンでも標準重イオンと同等の SEU 感度を示す一方、SEL は VCC_AUXIO に支配的であることを定量化。HDIO ハードダメージの追加観察（3件）も報告。ZU3EG のラッチアップ設計指針を策定するための基礎データ。",url:"https://ieeexplore.ieee.org/document/8584296/"} , {id:"austin2025",tag:"SEU – コンフィギュレーションメモリのシミュレーションと検出（2025）",title:"Single-event upset simulation and detection in configuration memory",meta:"H. Austin, C. Major, C. Barney, J. Williams, Z. Becker, M. Smith, B. LaMeres · Montana State University · Frontiers in Space Technologies · 2025 · DOI: 10.3389/frspt.2025.1610424",desc:"LaMeres Lab（MSU）による FPGA コンフィギュレーションメモリの SEU シミュレーションと検出手法に関する最新論文（2025年）。RadPC-Lunar ミッションの研究グループが執筆。SRAM FPGA のコンフィギュレーションビットストリームへの SEU 注入シミュレーションと、実機での検出アルゴリズムを評価。宇宙用 FPGA における SEU 検出・スクラビング設計の最新知見。",url:"https://www.frontiersin.org/journals/space-technologies/articles/10.3389/frspt.2025.1610424/full"}, {id:"vanharten2018",tag:"FPGA フォールトトレランス手法の必要性評価",title:"Determining the necessity of fault tolerance techniques in FPGA devices for space missions",meta:"G. van Harten et al. · Eindhoven University of Technology · Microprocessors and Microsystems · 2018",desc:"宇宙ミッション向け FPGA において TMR・スクラビング・ECC などのフォールトトレランス手法が本当に必要かを定量的に評価した論文。軌道・ミッション期間・FPGA 種別ごとに SEU 発生率を算出し、手法ごとのリスク低減効果とリソースオーバーヘッドをトレードオフ分析。COTS FPGA を宇宙ミッションに採用する際の設計判断基準を与える実用的資料。",url:"https://pure.tue.nl/ws/files/102831720/paper.pdf"}, {id:"berg2019",tag:"Xilinx Kintex-UltraScale XCKU040 – SEE 重イオン試験（NEPP 2019）",title:"Xilinx Kintex-UltraScale FPGA (XCKU040-2FFVA1156E) Single Event Effects Heavy-Ion Test Report",meta:"M. Berg et al. · NASA GSFC NEPP / LBNL · NEPP-TR-2019 · 2019年11月",desc:"NASA NEPP と LBNL が実施した Xilinx Kintex-UltraScale（XCKU040、20 nm TSMC HKMG）の SEE 重イオン試験レポート。LETth < 0.07 MeV·cm²/mg という非常に低い閾値が確認されており、Distributed TMR（DTMR）が誤りのクロスセクションを大幅に改善することを実証。スクラビング有無での SEU 比較データを含む。",url:"https://ntrs.nasa.gov/citations/20205007765"} ] }, { id:"cots-analog", label:"COTS アナログ部品（ADC 等）の SEE / TID 試験", note:"商用 ADC の放射線耐性評価・カメラ応用での SEE 試験", refs:[ {id:"q13",tag:"ADC – Radiation Tolerance",title:"Evaluation of Commercial ADC Radiation Tolerance for Accelerator Experiments",meta:"K. Chen et al. (BNL) · J. Instrum. 10, P08009 · 2015 · DOI: 10.1088/1748-0221/10/08/P08009",desc:"17 種の市販 ADC に対する TID 試験と、12/14 bit ADC 2 種の SEE 詳細評価。LHC の加速器放射線環境（ハドロン・中性子・ガンマ線）を念頭に置いたもので、ATLAS LAr カロリメータアップグレード向け COTS ADC 選定に適用された実用的なデータ。",url:"https://iopscience.iop.org/article/10.1088/1748-0221/10/08/P08009"}, {id:"ad7984-01",tag:"COTS ADC – カメラ応用 SEE",title:"Single Event Effects Testing of a Commercial-Off-The-Shelf Analog-to-Digital Converter in a Camera Application",meta:"IEEE NSREC 2016 Radiation Effects Data Workshop · DOI: 10.1109/NSREC.2016.7891739",desc:"Analog Devices AD7984（18 bit, SAR ADC）に対する重イオン照射 SEE 試験。カメラ応用として実際の回路に実装した状態での試験結果を報告しており、応用特化型の SEE 評価アプローチの事例として有用。COTS ADC の宇宙カメラ設計への適用可否判断に関連する資料。",url:"https://ieeexplore.ieee.org/abstract/document/7891739/"} ] }, { id:"cots-shielding", label:"放射線シールド・遮蔽技術", note:"Z-graded シールド・COTS 部品の寿命延長・CubeSat 実証", refs:[ {id:"q12",tag:"SmallSat – Shielding Demo",title:"Shields-1, A SmallSat Radiation Shielding Technology Demonstration",meta:"D. L. I. Thomsen et al. · 29th Annual AIAA/USU Conference on Small Satellites · 2015",desc:"小型衛星（SmallSat）における放射線遮蔽技術の実証例。原子番号（Z）グレーデッドシールドが同じ厚みのアルミシールドより電子遮蔽性能で約30%向上することを SPENVIS モデリングで示し、COTS 部品の耐放射線寿命延長を目的とした CubeSat ミッション。",url:"https://digitalcommons.usu.edu/smallsat/2015/all2015/84/"} ] }, { id:"rad-journals", label:"主要学術誌・会議論文集（RADECS / NSREC）", note:"放射線効果コミュニティの主要発表の場 – RADECS（欧州）· NSREC（米国）", refs:[ {id:"radecs01",tag:"RADECS – IEEE 会議論文集",title:"RADECS – Radiation Effects on Components and Systems (IEEE Conference Proceedings)",meta:"IEEE Nuclear and Plasma Sciences Society · 1989年〜現在 · 欧州最大の放射線効果会議",desc:"欧州最大の放射線効果学術会議 RADECS の全論文アーカイブ（IEEE Xplore）。TID・SEE・DDD・宇宙放射線環境・耐放射線回路設計・新材料・試験方法・COTS 部品評価に関する最新研究が発表される。NSREC と並ぶ世界最重要の放射線効果学術フォーラム。",url:"https://ieeexplore.ieee.org/xpl/conhome/1000608/all-proceedings"}, {id:"nsrec01",tag:"NSREC – IEEE 会議論文集",title:"IEEE Nuclear and Space Radiation Effects Conference (NSREC) – Conference Proceedings",meta:"IEEE Nuclear and Plasma Sciences Society · 1964年〜現在 · 米国最大の放射線効果会議",desc:"米国最大の放射線効果学術会議 NSREC の全論文アーカイブ（IEEE Xplore）。毎年7月開催。TID・SEE・DDD・宇宙放射線環境・耐放射線回路設計・新材料・試験方法に関する最新研究が発表される。併催の Radiation Effects Data Workshop（REDW）では査読なし速報の試験データも公開。RADECS と並ぶ世界最重要の放射線効果学術フォーラム。",url:"https://ieeexplore.ieee.org/xpl/conhome/1000609/all-proceedings"} ] } ] }, /* ═══════════════════════════════════════════════════ GROUP NEW: 部品放射線データベース ═══════════════════════════════════════════════════ */ { id:"g-partdb", label:"部品放射線データベース", color:"#be185d", desc:"NASA GSFC・NEPP・ESA・IEEE・DLA・TI が公開する宇宙用部品の放射線試験データ・規格品検索サービス", collapsed: false, sections: [ { id:"partdb-digital", label:"デジタル部品放射線データベース（CPU・FPGA・メモリなど）", note:"GSFC Radiation DB · NEPP Publications · NEPP Tasks · IEEE REDW · TI · Zero-G · ESA esarad · TRAD R2COTS", refs:[
            {id:"db01",tag:"GSFC – 放射線データベース",title:"GSFC Radiation Data Base – NASA Goddard Space Flight Center",meta:"NASA GSFC · Radiation Effects and Analysis Group（REAG）· 1,300点以上の部品",desc:"NASA GSFC の放射線効果解析グループ（REAG）が30年以上にわたり蓄積した部品放射線試験データベース。SEE（重イオン・陽子）および TID（Co-60）の試験レポートを部品番号で検索できる。COTS・宇宙用 IC・光電子デバイスなど広範な部品を収録。NASA ミッションの耐放射線設計の主要一次情報源。",url:"https://nepp.nasa.gov/radhome/RadDatabase/RadDataBase.html"},
            {id:"db02",tag:"NEPP – 文献検索ツール",title:"NASA NEPP Publication Lookup – Electronic Parts and Packaging Program",meta:"NASA NEPP · NASA Goddard / JPL · EEE 部品評価・放射線試験レポート",desc:"NASA の電子部品・パッケージングプログラム（NEPP）が公開する文献・報告書の全文検索ツール。SEE 試験レポート・TID 評価・信頼性評価・部品保証ガイドラインなど NASA ミッション向け EEE 部品に関するドキュメントが検索可能。Google カスタム検索を利用した全文検索として機能する。",url:"https://nepp.nasa.gov/radhome/RadPubDbase/RadPubDbase.html"},
            {id:"nepp-tasks",tag:"NEPP – 放射線試験データベース・文献検索ポータル",title:"NASA NEPP Radiation – GSFC Radiation Test Database & Publication Database",meta:"NASA NEPP · nepp.nasa.gov/pages/Radiation.cfm · GSFC REAG · FPGA / Memory / Analog / Compendium",desc:"NASA NEPP の放射線関連リソース集約ページ。GSFC 放射線試験データベース（1,300件超の部品試験レポート）・GSFC 文献データベース・GSFC Qualified Parts List へのリンクを集約。FPGA・メモリ・ADC・センサ・電圧レファレンス等のレポートは「GSFC Radiation Effects and Analysis Group Radiation Test Database」から部品番号で検索可能。従来の nepp.nasa.gov/docs/tasks/ ディレクトリは現在 NTRS に移行中のため、個別レポートは NTRS（ntrs.nasa.gov）でも検索できる。",url:"https://nepp.nasa.gov/pages/Radiation.cfm"}, {id:"gsfc-raddb-direct",tag:"GSFC – 放射線試験データベース（直リンク）",title:"GSFC Radiation Effects and Analysis Group – Radiation Test Database",meta:"NASA GSFC REAG · nepp.nasa.gov/radhome/RadDatabase/ · 1,300件超の部品試験レポート",desc:"GSFC 放射線試験データベースへの直接リンク（NEPP 移転後の現行 URL）。部品番号・デバイスカテゴリ・試験種別（TID / SEE / DDD）で1,300件超の試験レポートを検索できる。",url:"https://nepp.nasa.gov/radhome/RadDatabase/RadDataBase.html"}, {id:"gsfc-pubdb-direct",tag:"GSFC – 文献データベース（直リンク）",title:"GSFC Radiation Effects and Analysis Group – Publication Database",meta:"NASA GSFC REAG · nepp.nasa.gov/radhome/RadPubDbase/ · NEPP 論文・試験レポート全文検索",desc:"GSFC 放射線効果解析グループの文献データベースへの直接リンク（NEPP 移転後の現行 URL）。NEPP が発表した論文・試験レポート・技術メモを著者・デバイス名・キーワードで全文検索できる。",url:"https://nepp.nasa.gov/radhome/RadPubDbase/RadPubDbase.html"},
            {id:"db05",tag:"IEEE REDW – 放射線効果データワークショップ",title:"IEEE Radiation Effects Data Workshop (REDW) Record – IEEE Xplore",meta:"IEEE Nuclear and Plasma Sciences Society · NSREC 併催 · 1992年〜現在",desc:"1992年以降毎年 NSREC（核宇宙放射線効果会議）に併催される IEEE 放射線効果データワークショップ（REDW）の全論文アーカイブ。査読なしで速報的に提出された部品の SEE / TID 試験データを収録し、未公表データを含む速報情報源として放射線効果コミュニティで広く参照される。IEEE Xplore で無料閲覧可能。",url:"https://ieeexplore.ieee.org/xpl/conhome/8086/proceeding"},
            {id:"db06",tag:"TI – Space Products & Radiation Data",title:"Texas Instruments Space Products – Radiation-Hardened and Radiation-Tolerant Products",meta:"Texas Instruments · QML Class V / Class Q / Space-EP / SHP · ti.com/space",desc:"TI の宇宙用製品ポータル。QML Class V（深宇宙・セラミックパッケージ）・Class Q・Space Enhanced Plastic（SEP / LEO 向け）・SHP 規格品の製品ラインナップ、個別の TID / SEE / NDD 放射線試験レポート（PDF）を製品フォルダから無料で参照できる。SAMV71・TMS570 などの宇宙マイコンを含む広範なポートフォリオ。",url:"https://www.ti.com/applications/industrial/aerospace-defense/space/overview.html"},
            {id:"db07",tag:"Zero-G – COTS 放射線データベース（NewSpace）",title:"Zero-G Radiation Assurance – Radiation Database for COTS Electronics",meta:"Zero-G Radiation Assurance · 米国 · NewSpace / CubeSat / 商業衛星向け",desc:"NewSpace プログラム向けに特化した COTS 部品の放射線試験データベース。TID・SEE（重イオン・陽子）などの試験データを部品番号で検索でき、SWaP（Size Weight and Power）を重視する商業衛星設計者が放射線耐性 COTS 部品を選定するための主要ツール。従来の NASA GSFC データベースでカバーされていない最新 COTS デバイスのデータが充実。商用サービスだが一部の情報は無料で閲覧可能。",url:"https://www.zerogradiation.com/radiation-database"},
            {id:"db08",tag:"ESA Radiation Test Database（esarad）",title:"ESA Radiation Test Database – esarad.esa.int",meta:"European Space Agency · TEC-QEC · 2024年開設 · TRAD 等の COTS 試験結果収録",desc:"ESA が2024年に新設した公式の放射線試験データポータル。従来の ESCIES 放射線レポートを補完・拡張し、TRAD 等の欧州企業が ESA 契約のもとで実施した COTS 部品（電圧コンバータ・ADC・発振器・GaN FET・メモリなど）の TID・SEE 試験レポートを収録。CORHA 2024 プロジェクトの成果も掲載予定。情報利用には出典明示が必要であり、トレーサビリティの保証は利用者の責任とされている。",url:"https://esarad.esa.int/"},
            {id:"db09",tag:"TRAD R2COTS – COTS 放射線保証サービス",title:"R2COTS – Radiation & Reliability on Commercial-Off-The-Shelf (TRAD Tests & Radiations)",meta:"TRAD Tests & Radiations · フランス・ラベージュ · 100品超の COTS カタログ",desc:"フランスの放射線試験専門企業 TRAD が提供する COTS 専用放射線保証サービス。TID（Co-60）・重イオン SEE・レーザー照射による100品超の COTS 部品（電圧コンバータ・ADC・発振器・GaN FET・メモリ等）に対し、ダイ改版・マスクセット・ウェーハファブ・拡散ロット・組み立てロットまでのフルトレーサビリティを保証した「Class 3+」認定データを提供する。NewSpace 向けの実用的な COTS 調達・資格取得支援サービスとして ESA コミュニティでも参照されている。",url:"https://www.r2cots.com/"}
          ] },
        { id:"partdb-analog", label:"アナログ部品放射線データベース（ADC・センサ・電圧レファレンスなど）", note:"NEPP 070 アナログ試験レポート · Analog Devices · ESCIES – ADC / センサ / 電圧レファレンス / DC-DC コンバータ等", refs:[
            {id:"db03",tag:"ESCIES – ESA 放射線試験レポート",title:"ESCIES Radiation Test Reports Database – European Space Components Information Exchange System",meta:"ESA / European Space Components Information Exchange System · TID / SEE / DD レポート",desc:"ESA および欧州パートナーが実施した部品放射線試験レポートを収録したデータベース。TID・SEE・DD（変位損傷）などの試験結果が部品ごとに公開されており、機密でないものはすべて無料でアクセス可能。欧州宇宙機器設計者の主要参照源。",url:"https://escies.org/labreport/radiationList"},
            {id:"nepp-070",tag:"NEPP 070 – アナログ部品個別 TID / SEE 試験レポート",title:"NASA NEPP 070-Test-Reports – Analog Parts Radiation Test Reports",meta:"NASA NEPP · nepp.nasa.gov/docs/tasks/070-Test-Reports/ · ADC / センサ / 電圧レファレンス / DC-DC コンバータ",desc:"NASA NEPP GSFC が実施するアナログ部品の個別放射線試験レポート群。ADC・センサ（MEMS 加速度計・温度センサ）・電圧レファレンス・演算増幅器・DC-DC コンバータ等を対象に、MIL-STD-883 Method 1019 準拠の TID（Co-60）試験および重イオン・陽子 SEE 試験の詳細レポートを収録。従来の nepp.nasa.gov/docs/tasks/070/ ディレクトリから NASA NTRS に移行中。NTRS で「NEPP analog TID test report」等で検索するとレポートを参照できる。",url:"https://ntrs.nasa.gov/search?q=NEPP%20analog%20TID%20test%20report&center=GSFC"},
            {id:"adi-space",tag:"Analog Devices Aerospace – 宇宙用アナログ部品 & 試験レポート",title:"Analog Devices Aerospace & Defense Space Products",meta:"Analog Devices · analog.com/en/aerospace-defense-space · QML Class V / Class Q / Space Enhanced",desc:"Analog Devices の宇宙用製品ポータル。ADC・DAC・Op Amp・電圧レファレンス・マルチプレクサ等の QML Class V（宇宙用最高信頼性）・Class Q・Space Enhanced 製品の TID / SEE 試験レポートを製品ページから参照できる。アナログ信号チェーン（センサ → ADC → 処理）全体をカバーする広範なポートフォリオを持つ。",url:"https://www.analog.com/en/solutions/aerospace-defense-space.html"}
          ] },
        { id:"approved-parts", label:"認定部品リスト", note:"DLA SMD · JAXA 認定部品 · ESA EPPL · NASA NPSL – 放射線耐性保証済み部品の選定基準", refs:[ {id:"db04",tag:"DLA – Mil Specs & Drawings",title:"DLA Land and Maritime – MIL Spec / Standard Microcircuit Drawing (SMD) Search",meta:"Defense Logistics Agency (DLA) Land and Maritime · QML Class V / Class Q · Columbus, OH",desc:"米国国防兵站局（DLA）が管理する軍用・宇宙用 IC の標準マイクロ回路図面（SMD）および軍用規格（MIL-SPEC）の検索サービス。QML Class V（宇宙用最高信頼性）・Class Q 認定品の仕様・試験要求・承認メーカーリストを無料で検索できる。宇宙用部品選定の基礎情報として必須。",url:"https://landandmaritimeapps.dla.mil/programs/milspec/DocSearch.aspx"}, {id:"jaxa-parts",tag:"JAXA – 認定部品リスト",title:"JAXA 宇宙用電子部品認定品リスト（JAXA EEE Parts Pit）",meta:"JAXA 宇宙技術部門 · 宇宙用電子部品認定 · QML / QPL",desc:"JAXA が宇宙用途として認定した電子部品の認定品リスト。QML（Qualified Manufacturers List）および QPL（Qualified Parts List）に基づく認定品で、TID・SEE を含む放射線耐性が保証されている。国内の宇宙機器開発における部品選定の主要参照源。",url:"https://ssl.tksc.jaxa.jp/eeepitnl/jp/"}, {id:"eppl01",tag:"ESA EPPL – 欧州推奨部品リスト",title:"European Preferred Parts List (EPPL)",meta:"ESA / ESCIES · European Preferred Parts List · 欧州宇宙用推奨部品",desc:"ESA が管理する欧州宇宙用推奨部品リスト（EPPL）。ESCC 認定または ESA 評価済みの電子部品（IC・ディスクリート・受動部品）を収録し、放射線耐性・信頼性が確認された部品を検索できる。欧州宇宙機器の部品選定における標準参照リスト。",url:"https://escies.org/webdocument/showArticle?id=166"}, {id:"npsl01",tag:"NASA NPSL – NASA 部品選定リスト",title:"NASA Parts Selection List (NPSL)",meta:"NASA NEPP · NASA Parts Selection List · 宇宙用推奨部品",desc:"NASA NEPP が管理する宇宙用部品選定リスト（NPSL）。放射線耐性・信頼性・調達性を考慮した部品選定ガイダンスを提供。NASA のフライトプロジェクト向けに推奨される EEE 部品の包括的な参照源。",url:"https://nepp.nasa.gov/npsl/index.htm"} ] } ] }, /* ═══════════════════════════════════════════════════ GROUP 5: RadPC レファレンス ═══════════════════════════════════════════════════ */ { id:"g-radpc", label:"RadPC レファレンス", color:"#0891b2", desc:"Montana State University LaMeres Lab による RadPC（放射線耐性コンピュータ）研究", collapsed: false, sections: [ { id:"radpc-web", label:"Web Resources", note:"プロジェクト概要・論文リスト・リポジトリ", refs:[ {id:"rw1",tag:"Project Page",title:"RadPC – MSU's Moon Computer",meta:"LaMeres Lab · RadPC-Lunar プロジェクトページ",desc:"月面着陸ミッション（Blue Ghost Mission 1）に搭載される RadPC の概要ページ。ミッション目的、放射線環境、搭載ドシメータ、教育アウトリーチ向け説明などが掲載されている。",url:"https://www.montana.edu/blameres/moon.html"}, {id:"rw2",tag:"People / Theses",title:"LaMeres Lab – Graduate Students & Theses",meta:"MSU · Electrical & Computer Engineering",desc:"LaMeres 教授が指導した修士・博士論文の一覧ページ。RadPC 系を含む radiation-tolerant computing 関連の学位論文を網羅的に辿ることができる。",url:"https://www.montana.edu/blameres/students.html"}, {id:"rw3",tag:"Publications",title:"LaMeres Lab – Publications",meta:"RadPC / RadPC@Scale / Artemis / RadSat-g, -u など",desc:"2009 年以降の FPGA ベース radiation-tolerant computing 研究の主要論文リスト。Journal / Conference / Workshop 論文へのリンクがまとまっている。",url:"https://www.montana.edu/blameres/publications.html"}, {id:"rw4",tag:"Repository",title:"ScholarWorks – Montana State University",meta:"Theses & Dissertations at MSU",desc:"MSU の公式リポジトリ。論文タイトルや著者名で検索すると、RadPC 関連を含む多数の学位論文・技術レポートの PDF にアクセスできる。",url:"https://scholarworks.montana.edu/"} ] }, { id:"radpc-papers", label:"RadPC / RadPC@Scale – 代表的論文", note:"アーキテクチャ・月面ミッション・高高度気球実験", refs:[ {id:"rp1",tag:"Journal Paper",title:"RadPC: A Novel Single-Event Upset Mitigation Strategy for FPGA-Based Space Computing",meta:"C. M. Major et al. · Journal of Aerospace Information Systems · 2021",desc:"RadPC のコアアーキテクチャ（タイル化 soft processor, QMR, DMS, CMM, partial reconfiguration）を包括的に解説した代表論文。RadPC-Lunar ミッションや月面での SEE 実証についても概要が触れられている。",url:"https://doi.org/10.2514/1.I010859"}, {id:"rp2",tag:"Conference Paper",title:"Overview of the Upcoming RadPC-Lunar Mission",meta:"C. Major et al. · IEEE Aerospace Conference · 2021 · DOI: 10.1109/AERO50100.2021.9438284",desc:"CLPS / Blue Ghost 1 に搭載される RadPC-Lunar ミッションの概要。着陸地点（Mare Crisium）、ランダーとのインタフェース、搭載ドシメータ、月面運用シナリオなどがコンパクトにまとめられている。",url:"https://www.montana.edu/blameres/vitae/publications/d_conference_full/conf_full_051_lunar_mission_overview_mar21.pdf"}, {id:"rp3",tag:"Conference Paper",title:"RadPC@Scale: A Novel Approach to RadPC Single Event Upset Mitigation Strategy",meta:"J. Williams et al. · IEEE Aerospace Conference · 2022",desc:"RadPC のメモリ SEU 対策を、高高度気球実験「RadPC@Scale」で検証した論文。高度 70–85 kft における外部 SRAM SEU 率と DMS による修復回数などが報告されており、実環境での有効性を確認できる。",url:"https://www.montana.edu/blameres/vitae/publications/d_conference_full/conf_full_054_radpc_at_scale_mar22.pdf"}, {id:"rp4",tag:"Conference Paper",title:"Dynamic Reconfigurable Computing Architecture for Aerospace Applications",meta:"B. J. LaMeres & C. Gauer · IEEE Aerospace Conference · 2009 · DOI: 10.1109/AERO.2009.4839390",desc:"タイル化 soft processor＋partial reconfiguration の初期構想を示した論文。RadPC の基本思想（空間的回避・spare タイル活用）の原点となるアーキテクチャが説明されている。※ IEEE Xplore 収録。直接アクセスには機関認証が必要な場合がある。",url:"https://ieeexplore.ieee.org/document/4839390"}, {id:"rp5",tag:"Conference Paper",title:"Spatial Avoidance of Hardware Faults Using FPGA Partial Reconfiguration of Tile-Based Soft Processors",meta:"C. Gauer, B. J. LaMeres, D. Racek · IEEE Aerospace Conference · 2010 · DOI: 10.1109/AERO.2010.5446887",desc:"故障したタイル領域を局所的に切り離し、FPGA の別領域にタイルを再生成する「spatial avoidance」手法を提案した論文。RadPC のタイル再構成アルゴリズムの土台となる。※ IEEE Xplore 収録。直接アクセスには機関認証が必要な場合がある。",url:"https://ieeexplore.ieee.org/document/5446887"} ] }, { id:"radpc-phd", label:"PhD Theses", note:"RadPC の理論的バックボーンとなる博士論文", refs:[ {id:"rd1",tag:"PhD Thesis",title:"Reconfigurable Hardware Accelerators for High Performance Radiation Tolerant Computers",meta:"Raymond J. Weber · PhD · Montana State University · 2014",desc:"タイル化 soft processor＋spare＋部分再構成を用いた高性能ラドトレコンピュータを体系化した博士論文。RadPC の前身となる many-core アーキテクチャと、FPGA 上のハードウェアアクセラレータの構成が詳細に議論されている。",url:"https://www.montana.edu/blameres/vitae/students/student_008_WeberR0814.pdf"}, {id:"rd2",tag:"PhD Thesis",title:"Reliability Analysis of Radiation Induced Fault Mitigation Strategies in Field Programmable Gate Arrays",meta:"Justin A. Hogan · PhD · Montana State University · 2014",desc:"TMR, scrubbing, spare など、FPGA における各種 fault mitigation 戦略の信頼性を Markov モデルと宇宙線環境モデルで解析。RadPC のような冗長構成がどの程度 SEE 耐性・ミッション寿命を向上させるかを理論的に評価。",url:"https://www.montana.edu/blameres/vitae/students/student_009_HoganJ0514.pdf"}, {id:"rd3",tag:"PhD Thesis",title:"Novel Approach to Fault Tolerance in Space Computers Leveraging the RISC-V Architecture",meta:"Christopher M. Major · PhD · Montana State University · 2023",desc:"RadPC のコンセプト（タイル化 soft-core＋QMR＋部分再構成）を RISC-V ベースに拡張した博士論文。代表的な成果は Journal of Aerospace Information Systems (DOI: 10.2514/1.I010859) としても公表済み。博士論文本体は ScholarWorks (scholarworks.montana.edu) で検索可能。※ URL は LaMeres Lab 学生ページ（博士論文 PDF の番号が未確認のため暫定）。",url:"https://www.montana.edu/blameres/students.html"} ] }, { id:"radpc-msee", label:"MSEE Theses", note:"RadPC アーキテクチャと実証ミッションの詳細", refs:[ {id:"rm1",tag:"MSEE Thesis",title:"Radiation Tolerant Many-Core Computing System for Aerospace Applications",meta:"Clinton F. Gauer · MSEE · Montana State University · 2010",desc:"タイル状 soft-core プロセッサと FPGA 部分再構成を用いた many-core ラドトレシステムを提案。故障したタイル領域を空間的に回避する「spatial avoidance」の基本概念が示され、RadPC の原型となっている。",url:"https://www.montana.edu/blameres/vitae/students/student_005_GauerC0510.pdf"}, {id:"rm2",tag:"MSEE Thesis",title:"A Radiation Tolerant Computer Mission to the International Space Station",meta:"Connor R. Julien · MSEE · Montana State University · 2017",desc:"RadPC 系アーキテクチャを用いた「Artemis」ISS 実証ミッションの設計と結果をまとめた修士論文。ボード構成、スタック、運用モード、ISS 軌道での SEE 環境と RadPC の挙動が詳細に記述されている。",url:"https://www.montana.edu/blameres/vitae/students/student_014_JulienC0517.pdf"}, {id:"rm3",tag:"MSEE Thesis",title:"Implementation of a Radiation-Tolerant Computer Based on a LEON3 Architecture",meta:"David L. D. Turner · MSEE · Montana State University · 2015",desc:"SPARC/LEON3 soft-core を用いた TMR＋部分再構成コンピュータの実装。RadPC 以前の LEON3 世代の設計で、FPGA soft-core を用いた fault-tolerant OBC の基礎設計に相当する。",url:"https://www.montana.edu/blameres/vitae/students/student_012_TurnerD0815.pdf"}, {id:"rm4",tag:"MSEE Thesis",title:"Experiment Platform to Facilitate Flight Testing of Fault Tolerant Reconfigurable Computer Systems",meta:"Samuel A. Harkness · MSEE · Montana State University · 2015",desc:"高高度気球・sounding rocket 等を利用した、ラドトレ FPGA コンピュータのフライト試験プラットフォーム構築。RadSat-g / RadSat-u や RadPC@Scale など、後続の飛行実験の基盤となる設計がまとめられている。",url:"https://www.montana.edu/blameres/vitae/students/student_011_HarknessS0515.pdf"}, {id:"rm5",tag:"MSEE Thesis",title:"Optimization of Error Correcting Codes in FPGA Fabric Onboard Cube Satellites",meta:"Skylar Tamke · MSEE · Montana State University · 2019",desc:"CubeSat 上の FPGA ファブリックにおける ECC の導入方法と、性能・リソース・誤り訂正能力のトレードオフを検討。RadPC の ECC / scrubbing 戦略を考える際の背景資料として有用。",url:"https://www.montana.edu/blameres/vitae/students/student_017_TamkeS0519.pdf"}, {id:"rm6",tag:"MSEE / Other",title:"RadPC 関連センサ・セキュリティ拡張に関する学位論文（Buerkle / Gowens / Running Crane ほか）",meta:"MSU · LaMeres Lab",desc:"RadPC に統合される放射線センサやサイバーセキュリティ拡張（CyberShield / opcode obfuscation）に関する学位論文群。Perkins (2025) などの論文の参考文献に詳細リストが示されている。",url:"https://www.montana.edu/blameres/students.html"} ] } ] }, /* ═══════════════════════════════════════════════════ GROUP 6: 月面ミッション設計・運用 ═══════════════════════════════════════════════════ */ { id:"g-mission", label:"月面ミッション設計・運用", color:"#9333ea", desc:"EPS・熱設計・ローバー・CLPS・LuSEE-Night など月面ミッション全般の設計・運用に関する文献", collapsed: false, sections: [ { id:"cold-electronics", label:"低温・月夜エレクトロニクス", note:"Cold Electronics · Lunar Night Survival · 極低温動作評価", refs:[ {id:"s05",tag:"NASA – Cold Electronics",title:"Cold Electronics for Lunar Missions (NESC-RP-23-01873 / NASA TM-20250008583)",meta:"NASA Engineering & Safety Center (NESC) · 2025",desc:"月夜・極低温環境で動作する電子機器に関する包括的な技術評価レポート。コールドエレクトロニクス、パッケージング、材料、TID/SEE、サーマルサイクル、信頼性評価、Qualification 推奨など、極域ローバーや月夜運用機器に直接役立つ一次資料。",url:"https://ntrs.nasa.gov/citations/20250008583"}, {id:"s06",tag:"Lunar Night – Electronics Rerating",title:"Rerating of Electronic Components for Improved Lunar Mission Night Survival",meta:"S. Biswas · Technical University of Munich · PhD Thesis · 2023",desc:"月夜の極低温環境で電子部品を安全に動作させるための「温度デレーティング手法」を包括的にまとめた博士論文。各種 IC・パッケージ・材料の低温性能変化、測定データ、故障モード解析などが豊富で、月面ローバーの耐寒設計に直結する内容。",url:"https://mediatum.ub.tum.de/doc/1687567/mhrhcbkk3lddt5530dakus7gi.Janos%20Daniel%20Biswas.pdf"} ] }, { id:"power-eps", label:"Power / EPS / Cold Electronics", note:"Electrical Power System · Cold Survival · ECSS / NASA", refs:[ {id:"pw1",tag:"ECSS – Power Systems",title:"ECSS-E-ST-20-20C – Electrical Design and Interface Requirements for Power Supply",meta:"European Cooperation for Space Standardization · 2016年4月",desc:"宇宙機の電源配電（LCL/RLCL ベース）の設計要求を定義する ECSS の主要標準。電源バス電圧、冗長構成、LCL（Latching Current Limiter）の仕様・保護回路など、ローバーの電源設計にも直接適用可能な設計指針を提供。",url:"https://ecss.nl/standard/ecss-e-st-20-20c-space-engineering-electrical-design-and-interface-requirements-for-power-supply-15-april-2016-2/"}, {id:"pw2",tag:"ECSS – Power Handbook",title:"ECSS-E-HB-20-20A – Guidelines for Electrical Design and Interface Requirements for Power Supply",meta:"ESA / ECSS Handbook · 2016年4月",desc:"ECSS-E-ST-20-20C の詳細ハンドブック。LCL の動作原理・設計代替案・試験手順の解説、バッテリー運用、電力予算、サバイバル電力と熱設計の結合など、実務的な EPS 設計方法を解説。",url:"https://ecss.nl/home/ecss-e-hb-20-20a-space-engineering-guidelines-for-electrical-design-and-interface-requirements-for-power-supply-15-april-2016/"}, {id:"pw3",tag:"Lunar Rover – EPS Influence",title:"TOWARDS INFLUENCES OF THE EPS ON LUNAR ROVER'S SYSTEMS DESIGN",meta:"M. Mulsow et al. · Conference Paper · 2022",desc:"月面ローバーのシステム設計において、EPS が質量・熱設計・運用モード・ペイロード統合に与える影響を検討した研究。電源構成やバッテリ戦略が、ミッション継続時間や夜間サバイバル、ローバー全体アーキテクチャにどのように波及するかを整理。",url:"https://www.researchgate.net/publication/361163541_TOWARDS_INFLUENCES_OF_THE_EPS_ON_LUNAR_ROVER'S_SYSTEMS_DESIGN"}, {id:"p06",tag:"NASA – Project Management",title:"NASA Space Flight Program and Project Management Handbook",meta:"NASA Headquarters · 2014",desc:"NASA のプログラムおよびプロジェクト管理ハンドブック。リスク管理プロセスの参照元。",url:"https://ntrs.nasa.gov/citations/20150000400"}, {id:"p05",tag:"CubeSat – Design Spec",title:"CubeSat Design Specification (1U-12U), REV 14.1",meta:"The CubeSat Program, Cal Poly · 2022",desc:"New Space の代表格である CubeSat の設計仕様書。システムレベル試験の被験体要件として参照。",url:"https://www.nasa.gov/wp-content/uploads/2018/01/cubesatdesignspecificationrev14_12022-02-09.pdf"} ] }, { id:"lunar-rover", label:"Lunar Rover Architecture / Micro Rover", note:"Rover System Design · Mobility · Mission Architecture", refs:[ {id:"v01",tag:"CMU – Day/Night Rover",title:"Design of a Day / Night Lunar Rover (CMU-RI-TR-95-24)",meta:"P. Berkelman et al. · Carnegie Mellon University Robotics Institute · 1995",desc:"月昼夜を通して稼働可能なローバーのシステム設計を網羅した古典的レポート。電源、熱、運用モード、機械設計、通信などローバー設計の基本要素を体系化。",url:"https://www.ri.cmu.edu/pub_files/pub1/berkelman_peter_1995_1/berkelman_peter_1995_1.pdf"}, {id:"v02",tag:"Lunar Rover – Micro Rover",title:"A Lunar Micro Rover System Overview for Aiding Science and ISRU Missions",meta:"E. Smith et al. · iSAIRAS 2020 · NASA ARC / JPL",desc:"小型（月面マイクロ）ローバーのシステムアーキテクチャ、電源・通信・運用モード・ペイロード統合の全体像をまとめた包括的論文。現代の月面ローバー設計の SWaP 要求や運用設計を理解する一次資料として有用。",url:"https://arc.aiaa.org/doi/10.2514/6.i-SAIRAS20-263"}, {id:"v03",tag:"NASA VIPER – Rover System",title:"VIPER Rover Design and Mission Operations Overview",meta:"T. Fong et al. · NASA Ames / VIPER Team · 2025",desc:"NASA の極域探査ローバー VIPER のシステム設計と運用コンセプト。電源・熱設計、モビリティ、計装、ソフトウェア／自律運用など、現代の極域ローバー設計の実例として有用。",url:"https://ntrs.nasa.gov/citations/20250004148"}, {id:"v04",tag:"LUVMI-X – EU Micro Rover",title:"LUVMI and LUVMI-X: Lunar Volatiles Mobile Instruments",meta:"J. Gancet et al. · ASTRA 2019 · H2020 LUVMI-X",desc:"欧州 H2020 プロジェクト LUVMI/LUVMI-X のミッションコンセプトとローバープラットフォームを解説した論文。月極域での揮発性物質探査を目的としたマイクロローバーのアーキテクチャと試験結果をまとめている。",url:"https://www.researchgate.net/publication/337000512_Lunar_Volatiles_Mobile_Instrumentation_LUVMI_Project_Results"}, {id:"v05",tag:"JAXA SLIM – Nano Rovers",title:"SLIM Mission & Lunar Exploration Vehicles LEV-1 / LEV-2 (SORA-Q)",meta:"JAXA · SLIM Media Kit · 2023",desc:"小型月着陸実証機 SLIM と超小型ローバー LEV-1 / 変形ナノローバー LEV-2（SORA-Q）の公式概要。着陸精度のコンセプト、LEV の役割・構成や月面での撮像・通信の流れを俯瞰するのに適している。",url:"https://global.jaxa.jp/countdown/slim/SLIM-mediakit-EN_2308.pdf"}, {id:"v06",tag:"LEV-1 – Wheel Design",title:"Design of Wheel Grouser Geometry With Reduced Sinkage for LEV-1 Lunar Rover",meta:"M. Otsuki et al. · IEEE Robotics and Automation Letters · 2025",desc:"SLIM 搭載ローバー LEV-1 の車輪グラウザ形状を対象に、砂質レゴリス上での沈み込みを低減しつつトラクションを確保する幾何学設計手法を提案した最新論文。",url:"https://www.researchgate.net/publication/390867424_Design_of_Wheel_Grouser_Geometry_With_Reduced_Sinkage_for_LEV-1_Lunar_Rover"} ] }, { id:"clps", label:"CLPS / Lunar Payload Delivery", note:"NASA CLPS · Astrobotic · Intuitive Machines · Firefly · ESA BSGN", refs:[ {id:"cl1",tag:"NASA – CLPS Program",title:"NASA Commercial Lunar Payload Services (CLPS)",meta:"NASA · Lunar Delivery Program · Industry Partners",desc:"NASA が民間企業と連携して、科学ペイロードや技術実証機器を月面に配送するための CLPS の公式ページ。",url:"https://www.nasa.gov/commercial-lunar-payload-services/"}, {id:"cl2",tag:"NASA – CLPS Deliveries",title:"CLPS Deliveries – Lunar Science Payloads",meta:"NASA · CLPS Missions · Peregrine / Griffin / IM-1 / Blue Ghost",desc:"Astrobotic の Peregrine や Griffin、Intuitive Machines の Nova-C、Firefly の Blue Ghost など、CLPS フライトごとのペイロードや着陸地点に関する情報をまとめたページ。",url:"https://science.nasa.gov/lunar-science/clps-deliveries/"}, {id:"cl3",tag:"Astrobotic – Lunar Delivery",title:"Astrobotic – Plan Your Space Mission",meta:"Astrobotic · Lunar Lander / Rover · Payload Delivery",desc:"Astrobotic による月面ペイロード配送サービスの問い合わせ／ミッション検討ページ。月面着陸機やローバー上にペイロードを搭載するための基本的なインターフェース情報への入口。",url:"https://www.astrobotic.com/lunar-delivery/plan-a-mission/"}, {id:"cl4",tag:"ESA / Astrobotic – BSGN",title:"Payload Delivery on the Moon – BSGN / Lunar Logistics Services & Astrobotic",meta:"ESA BSGN · Lunar Logistics Services · Astrobotic",desc:"Lunar Logistics Services と Astrobotic による月面ペイロード配送サービスの紹介ページ。ヨーロッパからのペイロードピックアップ、打ち上げ、月面着陸、ローバー搭載などのサービス内容の概要が記載されている。",url:"https://bsgn.esa.int/service/payload-delivery-on-the-moon/"}, {id:"cl5",tag:"Astrobotic – Landers PUG",title:"Astrobotic Lunar Landers – Payload User's Guide (Peregrine & Griffin)",meta:"Astrobotic · January 。月面極域・夜間ミッションの電気設計基準を検討する際の貴重な参考例となる。",url:"https://arxiv.org/abs/2407.07173"} ] } ] }, /* ═══════════════════════════════════════════════════ GROUP NEW: 素粒子実験における耐放射線 ═══════════════════════════════════════════════════ */ { id:"g-hep", label:"耐放射線半導体関連の研究", color:"#dc2626", desc:"LHC / テバトロン / リニアック・KEK 実験周辺の混合放射線場が電子機器・検出器に与える影響、宇宙線ミュオン・中性子スペクトルの研究", collapsed: false, sections: [ { id:"cosmic-ray-ser", label:"地上・大気宇宙線による半導体ソフトエラー（スペクトル・SER）", note:"地上宇宙線スペクトル測定・SER 計算基礎・JEDEC 標準・シミュレーションツール", refs:[ {id:"q06",tag:"Ground Neutron Spectrum",title:"Measurement of the Flux and Energy Spectrum of Cosmic-Ray Induced Neutrons on the Ground",meta:"M. S. Gordon et al. · IEEE Trans. Nucl. Sci. 51 · 2004 · DOI: 10.1109/TNS.2004.839134",desc:"地上における宇宙線誘起中性子のフラックスとエネルギースペクトルの精密測定。Silicon と Boron を用いた検出器でニューヨーク市（海抜 15 m）における中性子スペクトルを測定し、エネルギー範囲 0.1 MeV–10 GeV にわたる標準スペクトルデータを確立。半導体ソフトエラー率（SER）の計算基準として広く引用され、J-PARC・RCNP 等の加速器施設における中性子 SEE 試験のスペクトル参照源でもある。",url:"https://ieeexplore.ieee.org/document/1369506/"}, {id:"ziegler96",tag:"IBM – Terrestrial Cosmic Rays (基礎)",title:"Terrestrial Cosmic Rays",meta:"J. F. Ziegler · IBM Journal of Research and Development 40(1) · 1996 · DOI: 10.1147/rd.401.0019",desc:"地上宇宙線が電子機器に与える影響の物理を体系的にレビューした基礎論文。海面での粒子組成（中性子・陽子・パイオン・ミュオン・電子・光子）のフラックスと、緯度・高度・太陽活動・日変化による変動を定量化。IBM の大規模フィールド試験データに基づき、半導体 SER と宇宙線の因果関係を確立した先駆的論文。Gordon 2004 の測定データ解釈の前提となる物理的基礎を与える。",url:"https://ieeexplore.ieee.org/document/5389443/"} ] }, { id:"kek-hep", label:"KEK / J-PARC – 素粒子実験・ミュオン SEE", note:"カロリメータ中性子による放射線損傷・J-PARC ミュオン SEE", refs:[ {id:"k02",tag:"J-PARC MLF – MUSE（ミュオン SEE）",title:"J-PARC MLF MUSE ビームラインを用いた半導体ミュオンソフトエラー試験",meta:"J-PARC 物質・生命科学実験施設（MLF）· MUSE · KEK / JAEA / ソシオネクスト",desc:"J-PARC MLF の MUSE ビームラインは世界最高強度の正・負ミュオンビームを提供し、宇宙線ミュオン起因の半導体ソフトエラー試験に使われている。中性子ビームラインも23本あるが、物質・生命科学研究向けであり半導体 SEE 試験への一般開放はされていない。高エネルギー中性子ソフトエラー試験には大阪大学 RCNP、熱中性子には京都大学 KUR が使われる。リンク先はミュオン vs. 中性子ソフトエラー比較研究（ソシオネクスト・KEK 等、2021年）のプレスリリース。",url:"https://j-parc.jp/c/press-release/2021/07/16000719.html"} ] }, { id:"cern-see", label:"CERN – R2E / CHARM / LHC", note:"LHC トンネル混合場 · R2E プログラム · CHARM 施設", refs:[ {id:"c01",tag:"CERN – SEE Review",title:"Single Event Effects in High-Energy Accelerators",meta:"D. García Alía · CERN Yellow Reports · 2017",desc:"高エネルギー加速器における混合場（高エネルギーハドロン＋中性子＋ガンマ線）が電子機器に与える SEE を体系的にレビュー。LHC・PS・SPS における SEE の起源、断面積、実機トリップ事例、宇宙線起因の SEE との違いなどを詳しく解説。",url:"https://cds.cern.ch/record/2320261/files/SEEs_in_high_energy_accelerators.pdf"}, {id:"c02",tag:"CERN – Mixed Field",title:"Method for Measuring Mixed-Field Radiation Levels Relevant for SEEs at the LHC",meta:"K. Røed et al. · IEEE Trans. Nucl. Sci. · 2010",desc:"LHC 実機における高エネルギーハドロン由来の SEE 評価に向けて、トンネル内混合場の線量・フルエンス・スペクトルを測定するための RadMon システムと解析手法を解説。実機環境での SEU レート推定の基盤となる手法。",url:"https://www.jlab.org/accel/RadCon/opsgraphs/CERN_radmon_docs/RadMonPaper_final.pdf"}, {id:"c03",tag:"CERN – CHARM Facility",title:"A Mixed Field Facility at CERN for Radiation Test: CHARM",meta:"A. Brugger et al. · J. Phys.: Conf. Ser. 1046, 012004 · 2018",desc:"CERN SPS を用いた混合場試験施設 CHARM の概要紹介。プロトン・パイオン・中性子・ガンマ線からなる広いエネルギー分布を持つ場で、宇宙機や LHC 用電子機器の SEE / TID 試験が行える。",url:"https://repository.kulib.kyoto-u.ac.jp/dspace/bitstream/2433/237395/1/1742-6596_1046_1_012004.pdf"}, {id:"c04",tag:"CERN – CHARM Characterization",title:"Mixed-Field Radiation Monitoring and Beam Characterization at the CERN CHARM Facility",meta:"D. Lacarrère et al. · EPJ Web Conf. · 2024",desc:"CHARM での混合場の線量・スペクトルを実測と FLUKA シミュレーションで比較し、SEE 試験ビームとしての特性を詳述。重イオン相当 LET 分布や線量率など、試験条件の具体的な数値が示されている。",url:"https://cds.cern.ch/record/2900883/files/document.pdf"}, {id:"c05",tag:"CERN – R2E",title:"Radiation to Electronics: Impact on CERN LHC Operation (Run 2 Overview & HL-LHC Outlook)",meta:"D. Wollmann et al. · RADECS / R2E Project · 2019",desc:"LHC Run 2 における電子機器の SEE 起因トリップ統計と対策（シールド・配置換え・冗長化・機器交換など）を総括したレビュー。HL-LHC に向けた R2E 戦略の概要も述べられている。",url:"https://www.academia.edu/80349687/Radiation_to_Electronics_Impact_on_CERN_LHC_Operation_Run_2_Overview_and_HL_LHC_Outlook"} ] }, { id:"fermilab-slac", label:"Fermilab / SLAC – Detectors & Electronics", note:"ハドロン・電子リニアック環境での放射線損傷と SEE", refs:[ {id:"f01",tag:"Fermilab – Overview",title:"Radiation Damage in Detectors and Electronics",meta:"R. Lipton · Beam Instrumentation Workshop (BIW08, SLAC) · 2008",desc:"テバトロンや LHC などのコライダー実験を念頭に、シリコン検出器や前置増幅器、FPGA/ASIC に対する TID / NIEL / SEE の影響と実験での障害事例をまとめた講演スライド。ハドロンコライダーにおける「現場の放射線問題」の全体像をつかむのに適している。",url:"https://epaper.kek.jp/BIW2008/papers/tuiotio02.pdf"}, {id:"f02",tag:"Fermilab – Mixed Field",title:"Radiation Effects and Fault Studies in Accelerator Electronics",meta:"Fermilab internal notes · Tevatron / Main Injector",desc:"ビームロスモニタ、電源、制御系などの電子回路に発生した SEU/SEL 事例と、その発生条件・対策をまとめた Fermilab の技術ノート群。どの程度の線束でどのような故障が出るかの感覚をつかむ参考になる。",url:"https://lss.fnal.gov/archive/2001/conf/Conf-01-328.pdf"}, {id:"f03",tag:"SLAC – Linac Environment",title:"Radiation Levels and Shielding for Electronics in High-Energy Electron Linacs",meta:"SLAC Reports · LCLS / FACET 周辺",desc:"高エネルギー電子リニアック周辺の二次中性子・フォトン場を評価し、電子機器の配置とシールド設計指針を与える SLAC のレポート。主に TID / NIEL を扱うが、リニアック由来の中性子場を理解する上で有用。",url:"https://www.slac.stanford.edu/cgi-wrap/getdoc/slac-r-732.pdf"}, {id:"f04",tag:"SLAC – Beam Diagnostics",title:"Radiation Damage Considerations in Accelerator Beam Instrumentation",meta:"D. W. Storey · IBIC 2015 · KEK / Tsukuba",desc:"ビーム位置モニタやプロファイルモニタなどのビーム計測器における放射線損傷・SEE を概説した IBIC 2015 の招待講演。電子機器の配置・ケーブリング・シャドーイングなど、実務的な対策が整理されている。",url:"https://accelconf.web.cern.ch/IBIC2015/papers/weaua3.pdf"} ] } ] }, ]
